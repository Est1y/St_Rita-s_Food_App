}
function submitDebt(id){
  let cust=cuVal('dbCust').trim().replace(/\s+/g,' ');
  const item=cuVal('dbItem').trim();
  const qty=parseFloat(cuVal('dbQty'))||0;
  const amount=parseFloat(cuVal('dbAmt'))||0;
  if(!cust){ toast('Enter the customer name','bad'); return; }
  if(!item){ toast('Enter the item','bad'); return; }
  if(qty<=0){ toast('Qty must be more than zero','bad'); return; }
  if(amount<=0){ toast('Enter the amount','bad'); return; }
  if(!Array.isArray(store.settings.debts)) store.settings.debts=[];
  /* reuse the spelling already on the list so one customer never splits into two */
  const known=debtCustomers().find(function(c){ return c.key===custKey(cust); });
  if(known) cust=known.name;
  const date=cuVal('dbDate')||today();
  const note=cuVal('dbNote').trim();
  if(id){
    const d=store.settings.debts.find(function(x){ return x.id===id; });
    if(!d){ toast('That record is no longer there','bad'); closeModal(); return; }
    d.cust=cust; d.item=item; d.qty=qty; d.amount=amount; d.date=date; d.note=note;
  } else {
    store.settings.debts.push({ id:uid(), ts:Date.now(), date:date, cust:cust, item:item, qty:qty, amount:amount, note:note, paid:false });
  }
  saveSet(); closeModal(); rerender();
  toast(id?'Debt updated':('Debt added - '+money(qty*amount)),'good');
}
function toggleDebtPaid(id){
  const d=(store.settings.debts||[]).find(function(x){ return x.id===id; }); if(!d)return;
  if(d.paid){ d.paid=false; d.paidDate=''; saveSet(); rerender(); toast('Moved back to owing','good'); return; }
  askConfirm('Mark '+(d.cust||'this customer')+" - "+money(debtTotal(d))+' as paid?', function(){
    d.paid=true; d.paidDate=today(); saveSet(); rerender(); toast('Marked as paid','good');
  }, 'Mark paid');
}
function delDebt(id){
  const d=(store.settings.debts||[]).find(function(x){ return x.id===id; }); if(!d)return;
  askConfirm('Remove '+(d.cust||'this')+' - '+(d.item||'')+' ('+money(debtTotal(d))+') from the debt list?', function(){
    store.settings.debts=(store.settings.debts||[]).filter(function(x){ return x.id!==id; });
    saveSet(); rerender();
  }, 'Delete', true);
}
/* what Download and Print cover: the current customer and Owing/Paid/All filter, oldest first */
function debtExportList(){
  return debtRows().slice().sort(function(a,b){ return (''+(a.date||'')).localeCompare(''+(b.date||'')) || (a.ts||0)-(b.ts||0); });
}
function debtExportName(){
  const c=debtCust?debtCustomers().find(function(x){ return x.key===debtCust; }):null;
  return c?c.name:'';
}
function exportDebts(){
  const list=debtExportList();
  if(!list.length){ toast('Nothing to export','bad'); return; }
  const rows=[['Date','Customer name','Item','Qty','Amount','Total','Status','Paid on','Note']];
  list.forEach(function(d){ rows.push([d.date||'',d.cust||'',d.item||'',Number(d.qty)||0,Number(d.amount)||0,debtTotal(d),d.paid?'Paid':'Owing',d.paidDate||'',d.note||'']); });
  rows.push(['TOTAL OWING','','','','',list.filter(function(d){ return !d.paid; }).reduce(function(a,d){ return a+debtTotal(d); },0),'','','']);
  rows.push([]);
  rows.push(['TOTAL PER CUSTOMER','','','','','Owing','Paid','Items owing','Last debt']);
  const keys={}; list.forEach(function(d){ keys[custKey(d.cust)]=1; });
  debtCustomers().filter(function(c){ return keys[c.key]; }).forEach(function(c){ rows.push([c.name,'','','','',c.owing,c.paid,c.nOpen,c.last]); });
  const who=debtExportName();
  dl(new Blob([csvOf(rows)],{type:'text/csv'}), 'St-Ritas-Foodz-debts-'+(who?who.replace(/[^\w]+/g,'-')+'-':'')+today()+'.csv');
  toast('Debt list exported','good');
}
function printDebts(){
  const list=debtExportList();
  if(!list.length){ toast('Nothing to print','bad'); return; }
  const who=debtExportName();
  const owing=list.filter(function(d){ return !d.paid; }).reduce(function(a,d){ return a+debtTotal(d); },0);
  const main=printTable(['Date','Customer','Item','Qty','Amount','Total','Status'],
    list.map(function(d){ return [d.date?niceDate(d.date):'-', d.cust||'-', d.item||'-', Number(d.qty)||0, Number(d.amount)||0, debtTotal(d),
      d.paid?'Paid'+(d.paidDate?' '+niceDate(d.paidDate):''):'Owing']; }),
    ['Total owing','','','','',owing,'']);
  let per='';
  if(!who){
    const keys={}; list.forEach(function(d){ keys[custKey(d.cust)]=1; });
    const custs=debtCustomers().filter(function(c){ return keys[c.key]; });
    per='<h2>Total per customer</h2>'+printTable(['Customer','Items owing','Owing','Paid'],
      custs.map(function(c){ return [c.name, c.nOpen, c.owing, c.paid]; }),
      [custs.length+' customers','',custs.reduce(function(a,c){ return a+c.owing; },0),custs.reduce(function(a,c){ return a+c.paid; },0)]);
  }
  printDoc('Debt list'+(who?' · '+who:'')+' ('+debtFilterLabel().toLowerCase()+')', main+per);
}

/* ===== CUSTOMER CONTACTS ===== */
let contactSearch='';
function contactRows(){
  const q=contactSearch.toLowerCase();
  return (store.settings.contacts||[]).slice()
    .filter(function(c){
      if(!q) return true;
      return (c.name||'').toLowerCase().indexOf(q)>-1
          || (c.phone||'').toLowerCase().indexOf(q)>-1
          || (c.email||'').toLowerCase().indexOf(q)>-1;
    })
    .sort(function(a,b){ return (a.name||'').localeCompare(b.name||''); });
}
function contactTableHTML(){
  const list=contactRows();
  if(!list.length){
    return '<div class="card"><div class="empty"><b>'
      +(contactSearch?'No contact matches':'No contacts yet')+'</b>'
      +(contactSearch?'Try a different name or number.':'Tap &ldquo;Add a contact&rdquo; to save a customer&rsquo;s name, phone and email.')
      +'</div></div>';
  }
  const rows=list.map(function(c){
    const tel=(c.phone||'').replace(/[^0-9+]/g,'');
    return '<tr>'
      +'<td class="cust">'+esc(c.name||'-')+'</td>'
      +'<td style="text-align:left">'+(tel?'<a href="tel:'+esc(tel)+'" style="color:var(--brand-2);font-weight:700">'+esc(c.phone)+'</a>':'-')+'</td>'
      +'<td style="text-align:left">'+(c.email?'<a href="mailto:'+esc(c.email)+'" style="color:var(--brand-2)">'+esc(c.email)+'</a>':'-')+'</td>'
      +'<td style="white-space:nowrap">'
        +'<button class="cedit" title="Edit" onclick="openContactForm(\''+c.id+'\')">&#9998;</button>'
        +'<button class="crem" title="Delete" onclick="delContact(\''+c.id+'\')">&#10005;</button>'
      +'</td></tr>';
  }).join('');
  return '<div class="card tscroll"><table class="mtable debtable">'
    +'<thead><tr><th>Name</th><th style="text-align:left">Phone number</th><th style="text-align:left">Email</th><th></th></tr></thead>'
    +'<tbody>'+rows+'</tbody>'
    +'<tfoot><tr><td colspan="3">'+list.length+' contact'+(list.length!==1?'s':'')+'</td><td></td></tr></tfoot>'

function renderContacts(){
  document.getElementById('v-contacts').innerHTML=''

function refreshContactTable(){

}
function openContactForm(id){
  const c=id ? (store.settings.contacts||[]).find(function(x){ return x.id===id; }) : null;
  openModal(c?'Edit contact':'Add a contact',
     '<div class="field"><label>Name</label><input id="ctName" value="'+esc(c?c.name:'')+'" placeholder="e.g. Mama Chika"></div>'
    +'<div class="field"><label>Phone number</label><input id="ctPhone" type="tel" inputmode="tel" value="'+esc(c?c.phone:'')+'" placeholder="e.g. 07030361463"></div>'
    +'<div class="field"><label>Email</label><input id="ctEmail" type="email" inputmode="email" value="'+esc(c?c.email:'')+'" placeholder="e.g. name@email.com"></div>'
    +'<div class="field" style="margin-bottom:0"><label>Note (optional)</label><input id="ctNote" value="'+esc(c?(c.note||''):'')+'" placeholder="e.g. buys in cartons"></div>',
     '<div class="two"><button class="btn ghost" onclick="closeModal()">Cancel</button>'
     +'<button class="btn primary" onclick="submitContact('+(c?('\''+c.id+'\''):'')+')">'+(c?'Save changes':'Add contact')+'</button></div>');
  setTimeout(function(){ const el=document.getElementById('ctName'); if(el)el.focus(); },60);
}
function submitContact(id){
  const name=cuVal('ctName').trim();
  const phone=cuVal('ctPhone').trim();
  const email=cuVal('ctEmail').trim();
  const note=cuVal('ctNote').trim();
  if(!name){ toast('Enter the name','bad'); return; }
  if(!phone && !email){ toast('Enter a phone number or an email','bad'); return; }
  if(email && email.indexOf('@')<1){ toast('That email does not look right','bad'); return; }
  if(!Array.isArray(store.settings.contacts)) store.settings.contacts=[];
  /* warn on a duplicate number rather than silently saving two of the same person */
  const clash=store.settings.contacts.find(function(x){
    return x.id!==id && phone && (x.phone||'').replace(/[^0-9]/g,'')===phone.replace(/[^0-9]/g,'');
  });
  if(clash){ toast(esc(clash.name)+' already has that number','bad'); return; }
  if(id){
    const c=store.settings.contacts.find(function(x){ return x.id===id; });
    if(!c){ toast('That contact is no longer there','bad'); closeModal(); return; }
    c.name=name; c.phone=phone; c.email=email; c.note=note;
  } else {
    store.settings.contacts.push({ id:uid(), ts:Date.now(), name:name, phone:phone, email:email, note:note });
  }
  saveSet(); closeModal(); renderContacts();
  toast(id?'Contact updated':'Contact saved','good');
}
function delContact(id){
  const c=(store.settings.contacts||[]).find(function(x){ return x.id===id; }); if(!c)return;
  askConfirm('Remove '+(c.name||'this contact')+' from your contact list?', function(){
    store.settings.contacts=(store.settings.contacts||[]).filter(function(x){ return x.id!==id; });
    saveSet(); renderContacts();
  }, 'Delete', true);
}
function exportContacts(){
  const list=(store.settings.contacts||[]).slice().sort(function(a,b){ return (a.name||'').localeCompare(b.name||''); });
  if(!list.length){ toast('Nothing to export','bad'); return; }
  const rows=[['Name','Phone number','Email','Note']];
  list.forEach(function(c){ rows.push([c.name||'',c.phone||'',c.email||'',c.note||'']); });
  const csv=rows.map(function(r){ return r.map(function(c){ c=(c==null?'':''+c); return /[",\n]/.test(c)?'"'+c.replace(/"/g,'""')+'"':c; }).join(','); }).join('\n');
  dl(new Blob([csv],{type:'text/csv'}), 'St-Ritas-Foodz-contacts-'+today()+'.csv'); toast('Contacts exported','good');
}

function refreshItems(){

  list=list.sort((a,b)=> itemFilter==='low' ? a.qp-b.qp : a.name.localeCompare(b.name));
  const rows=list.map(p=>{
    const margin=(p.pp>0&&p.cost>0)?(((p.pp-p.cost)/p.cost*100).toFixed(0)+'% margin'):'';
    const costTxt=p.cost>0?('cost '+money(p.cost)):'';
    const meta=[costTxt,margin].filter(Boolean).join(' · ');
    return `
    <div class="icard">
      <div class="ih"><div class="n" style="cursor:pointer;text-decoration:underline;text-decoration-style:dotted;text-underline-offset:3px" title="Tap for full details" onclick="openItemDetail('${p.id}')">${esc(p.name)}</div><div class="c">${esc(p.cat)}</div><button class="del" style="color:var(--ink-soft)" onclick="openItemActions('${p.id}')">⋯</button></div>

function setField(id,f,v){ const p=store.products.find(x=>x.id===id); if(!p)return;
  const nv=v===''?0:(parseFloat(v)||0);
  if((f==='qp'||f==='qc') && nv < (p[f]||0)){
    refreshItems(); // revert the visible number until the passkey is approved
    askPin('reduce stock of '+p.name, function(){ p[f]=nv; saveP(); refreshItems(); toast('Stock updated','good'); });
    return;
  }
  p[f]=nv; saveP(); if(itemFilter==='low') refreshItems(); }

/* ----- full item details: prices, stock, and every sale / purchase of it ----- */
function itemDetailStats(p){
  const lines=[];       // every sale line for this product
  store.sales.forEach(function(s){
    (s.items||[]).forEach(function(it){
      if(it.id!==p.id) return;
      lines.push({ date:s.date, ts:s.ts, staff:s.staff||'', note:s.note||'', channel:s.channel||'',
        unit:it.unit||'pcs', qty:Number(it.qty)||0, price:Number(it.price)||0, sub:Number(it.sub)||0 });
    });
  });
  lines.sort(function(a,b){ return (b.ts||0)-(a.ts||0); });
  const buys=store.purchases.filter(function(b){ return b.itemId===p.id || (b.itemName||'').toLowerCase()===p.name.toLowerCase(); })
    .slice().sort(function(a,b){ return (b.ts||0)-(a.ts||0); });
  const qtySold=lines.reduce(function(a,l){ return a+l.qty; },0);
  const rev=lines.reduce(function(a,l){ return a+l.sub; },0);
  const cost=lines.reduce(function(a,l){ return a+l.qty*(l.unit==='ctn'?(p.costC||0):(p.cost||0)); },0);
  return { lines:lines, buys:buys, qtySold:qtySold, rev:rev, cost:cost, profit:rev-cost };
}

function renameItem(id){ const p=store.products.find(x=>x.id===id); if(!p)return;
  const nm=cuVal('iaName').trim(); if(!nm){ toast('Enter a name','bad'); return; }
  p.name=nm; p.cat=guessCat(nm); saveP(); closeModal(); renderItems(); toast('Renamed','good'); }
function mergeItem(id){
  const src=store.products.find(x=>x.id===id); if(!src)return;
  const targetName=cuVal('iaMerge').trim(); if(!targetName){ toast('Choose an item to merge into','bad'); return; }
  const tgt=store.products.find(x=>x.name.toLowerCase()===targetName.toLowerCase() && x.id!==id);
  if(!tgt){ toast('Target item not found','bad'); return; }
  askConfirm('Merge "'+src.name+'" into "'+tgt.name+'"?\nStock will be added together and "'+src.name+'" removed.', function(){
    tgt.qp=+(tgt.qp+src.qp).toFixed(2); tgt.qc=+(tgt.qc+src.qc).toFixed(2);
    ['pp','pc','pw','cost','costC'].forEach(f=>{ if(!tgt[f] && src[f]) tgt[f]=src[f]; });
    store.products=store.products.filter(x=>x.id!==id); saveP(); renderItems(); toast('Merged into '+tgt.name,'good');
  }, 'Merge');
}
function markSold(id){
  const p=store.products.find(x=>x.id===id); if(!p)return;
  const qty=parseFloat(cuVal('iaQty'))||0;
  const unit=cuVal('iaUnit')==='ctn'?'ctn':'pcs';
  const mode=cuVal('iaMode'); const note=cuVal('iaNote').trim();
  if(qty<=0){ toast('Enter the quantity','bad'); return; }
  askPin(mode==='counted'?'reduce stock already counted for '+p.name:'record '+p.name+' sold', function(){
    const price=unit==='ctn'?(p.pc||0):(p.pp||0);
    if(unit==='ctn') p.qc=+(p.qc-qty).toFixed(2); else p.qp=+(p.qp-qty).toFixed(2);
    store.sales.push({ id:uid(), date:today(), ts:Date.now(), staff:'', note:note||(mode==='counted'?'Sold (already counted)':'Sold outside app'),
      items:[{id:p.id,name:p.name,unit,qty,price,sub:qty*price}], total:qty*price, noIncome:(mode==='counted') });
    saveP(); saveS(); renderItems();
    toast(mode==='counted'?'Stock reduced (not added to income)':'Sale recorded · '+money(qty*price),'good');
  });
}

/* ===== EDIT RECORDS (fix wrong input) =====
   Every edit follows the same rule: undo what the record did to stock,
   then apply what it now says. Money follows the record itself. */
function stockApply(itemId, unit, qty, sign){
  if(!itemId || !(qty>0)) return;
  const p=store.products.find(function(x){ return x.id===itemId; }); if(!p) return;
  if(unit==='ctn') p.qc=+(p.qc + sign*qty).toFixed(2); else p.qp=+(p.qp + sign*qty).toFixed(2);
}
/* was this purchase the one that set the item's current cost/price? */
function isLatestBuyFor(purchase){
  if(!purchase.itemId) return false;
  return !store.purchases.some(function(x){
    return x.itemId===purchase.itemId && x.id!==purchase.id && x.unit===purchase.unit
      && ((''+x.date).localeCompare(''+purchase.date)>0 || (x.date===purchase.date && (x.ts||0)>(purchase.ts||0)));
  });
}
function editRecord(kind,id){
  if(kind==='b') editPurchase(id);
  else if(kind==='s') editSale(id);
  else editExpense(id);
}

function editBuyPreview(){
  const qty=parseFloat(cuVal('epQty'))||0, amount=parseFloat(cuVal('epAmt'))||0;
  const sellP=parseFloat(cuVal('epSellP'))||0;
  const el=document.getElementById('epPreview'); if(!el) return;
  if(qty<=0||amount<=0){ el.textContent='Enter quantity and amount to see the cost rate.'; return; }
  const rate=amount/qty, unit=cuVal('epUnit')==='ctn'?'carton':'piece';
  el.innerHTML='New cost rate: <b>'+money(rate)+'</b> per '+unit
    +(sellP>0?' &nbsp;·&nbsp; profit '+'<b style="color:'+((sellP-rate)<0?'var(--out)':'var(--in)')+'">'+money(sellP-rate)+'</b> each':'');
}
function submitEditPurchase(id,neg){
  const p=store.purchases.find(function(x){ return x.id===id; });
  if(!p){ toast('That purchase is no longer there','bad'); return; }
  const amount=parseFloat(cuVal('epAmt'))||0;
  const date=cuVal('epDate')||p.date;
  const desc=cuVal('epDesc').trim();
  if(amount<=0){ toast('Enter the amount','bad'); return; }

  if(isAdjust(p) || !p.itemId){
    p.amount = neg ? -Math.abs(amount) : Math.abs(amount);
    p.date=date; p.desc=desc;
    saveB(); closeModal(); rerender(); toast('Entry updated','good');
    return;
  }

  const name=cuVal('epItem').trim();
  const target=store.products.find(function(x){ return x.name.toLowerCase()===name.toLowerCase(); });
  if(!target){ toast('Pick an item that is already on your list','bad'); return; }
  const qty=parseFloat(cuVal('epQty'))||0;
  const unit=cuVal('epUnit')==='ctn'?'ctn':'pcs';
  const sellP=parseFloat(cuVal('epSellP'))||0;
  const sellW=parseFloat(cuVal('epSellW'))||0;
  const rate=qty>0?+(amount/qty).toFixed(2):0;
  const wasLatest=isLatestBuyFor(p);

  stockApply(p.itemId, p.unit, Number(p.qty)||0, -1);   // take back what this record added
  stockApply(target.id, unit, qty, +1);                 // add what it now says

  p.date=date; p.supplier=cuVal('epSup'); p.desc=desc;
  p.itemId=target.id; p.itemName=target.name;
  p.qty=qty; p.unit=unit; p.amount=amount; p.rate=rate; p.sellP=sellP; p.sellW=sellW;
  const expiry=cuVal('epExp');
  if(expiry!==(p.expiry||'')){ p.expiry=expiry; p.expiryDone=false; }   // a new date re-arms the reminder
  p.stockNote=(qty>0?('+'+qty+' '+unit+' '+target.name):'');

  // only refresh the item's cost/price if this purchase is the one that set them
  if(wasLatest){
    if(unit==='ctn'){ if(rate>0)target.costC=rate; if(sellP>0)target.pc=sellP; }
    else { if(rate>0)target.cost=rate; if(sellP>0)target.pp=sellP; if(sellW>0)target.pw=sellW; }
  }
  saveP(); saveB(); closeModal(); rerender();
  toast('Purchase updated'+(wasLatest?' · item prices refreshed':''),'good');
}

    return;
  }
  const lines=s.items.map(function(it,i){
    return '<div class="eline" id="esLine'+i+'">'
      +'<div class="en">'+esc(it.name)+' <span style="font-weight:600;color:var(--ink-soft)">/'+(it.unit==='ctn'?'ctn':'pcs')+'</span></div>'
      +'<div class="eq"><label>Qty</label><input class="num" type="number" inputmode="decimal" id="esQty'+i+'" value="'+(Number(it.qty)||0)+'" oninput="editSalePreview()"></div>'
      +'<div class="eq"><label>Price</label><input class="num" type="number" inputmode="decimal" id="esPrice'+i+'" value="'+(Number(it.price)||0)+'" oninput="editSalePreview()"></div>'
      +'<button class="crem" title="Remove this item" onclick="dropSaleLine('+i+')">✕</button></div>';
  }).join('');
  openModal('Edit sale',
     '<div class="hint">Change a quantity or price and the stock is corrected by the difference. Removing a line puts that stock back.</div>'
    +'<div class="card" style="margin-bottom:12px">'+lines+'</div>'
    +'<div id="esTotalBox" class="num" style="font-weight:800;font-size:15px;margin:0 2px 12px"></div>'
    +common,
     '<div class="two"><button class="btn ghost" onclick="closeModal()">Cancel</button>'
    +'<button class="btn primary" onclick="submitEditSale(\''+id+'\')">Save changes</button></div>');
  _editSaleId=id; _editSaleDropped=[];
  editSalePreview();
}
var _editSaleDropped=[], _editSaleId=null;
function dropSaleLine(i){
  const el=document.getElementById('esLine'+i); if(!el) return;
  if(_editSaleDropped.indexOf(i)<0) _editSaleDropped.push(i);
  el.style.display='none';
  editSalePreview();
}
function saleLineValues(s){
  const out=[];
  (s.items||[]).forEach(function(it,i){
    if(_editSaleDropped.indexOf(i)>=0) return;
    const q=parseFloat(cuVal('esQty'+i)); const pr=parseFloat(cuVal('esPrice'+i));
    out.push({ i:i, item:it, qty:isNaN(q)?0:q, price:isNaN(pr)?0:pr });
  });
  return out;
}
function editSalePreview(){
  const box=document.getElementById('esTotalBox'); if(!box) return;
  const s=store.sales.find(function(x){ return x.id===_editSaleId; }); if(!s) return;
  const tot=saleLineValues(s).reduce(function(a,l){ return a + l.qty*l.price; },0);
  box.textContent='New sale total: '+money(tot);
}
function submitEditSale(id){
  const s=store.sales.find(function(x){ return x.id===id; });
  if(!s){ toast('That sale is no longer there','bad'); return; }
  const date=cuVal('esDate')||s.date;
  const staff=cuVal('esStaff');
  const note=cuVal('esNote').trim();

  if(s.airtime){
    const amt=parseFloat(cuVal('esAirAmt'))||0, cash=parseFloat(cuVal('esAirCash'))||0;
    if(amt<=0){ toast('Enter the airtime amount','bad'); return; }
    if(cash<0){ toast('Cash back cannot be negative','bad'); return; }
    const platform=cuVal('esAirPlat')||s.airtime.platform;
    s.airtime={ amount:amt, cashback:cash, platform:platform };
    s.total=+(amt+cash).toFixed(2); s.date=date; s.staff=staff; s.note='Airtime · '+platform;
    saveS(); closeModal(); rerender(); toast('Airtime sale updated · '+money(s.total),'good');
    return;
  }

  if(!(s.items && s.items.length)){
    const total=parseFloat(cuVal('esTotal'))||0;
    if(total<=0){ toast('Enter the amount','bad'); return; }
    s.total=total; s.date=date; s.staff=staff; s.note=note;
    s.channel=note;
    unlinkSaleFromPurchase(s.id);
    linkSaleToPurchase(s);
    saveS(); closeModal(); rerender(); toast('Sale updated','good');
    return;
  }

  const lines=saleLineValues(s);
  if(!lines.length){ toast('A sale needs at least one item — delete it instead','bad'); return; }
  if(lines.some(function(l){ return l.qty<=0; })){ toast('Quantity must be more than zero','bad'); return; }
  const total=lines.reduce(function(a,l){ return a + l.qty*l.price; },0);
  if(total<=0){ toast('Enter a price for the items','bad'); return; }

  s.items.forEach(function(it){ stockApply(it.id, it.unit, Number(it.qty)||0, +1); });   // put the old sale's stock back
  lines.forEach(function(l){ stockApply(l.item.id, l.item.unit, l.qty, -1); });          // take out what it now says

  s.items=lines.map(function(l){
    return { id:l.item.id, name:l.item.name, unit:l.item.unit, qty:l.qty,
      price:Number(l.price)||0, sub:+(l.qty*(Number(l.price)||0)).toFixed(2) };
  });
  s.total=+total.toFixed(2); s.date=date; s.staff=staff; s.note=note;
  /* the note doubles as the sale type here, so re-derive the link and re-post it */
  s.channel=note;
  unlinkSaleFromPurchase(s.id);
  linkSaleToPurchase(s);
  saveP(); saveS(); closeModal(); rerender(); toast('Sale updated · '+money(total),'good');
}
/* ----- expense ----- */
function editExpense(id){
  const e=store.expenses.find(function(x){ return x.id===id; });
  if(!e){ toast('That expense is no longer there','bad'); return; }
  const catOpts=EXP_CATS.map(function(c){ return '<option '+(c===e.cat?'selected':'')+'>'+c+'</option>'; }).join('');
  openModal('Edit expense',
     '<div class="field"><label>Expense type</label><select id="eeCat">'+catOpts+'</select></div>'
    +'<div class="field"><label>Description</label><input id="eeDesc" value="'+esc(e.desc||'')+'" placeholder="optional"></div>'
    +'<div class="two">'
      +'<div class="field"><label>Amount</label><div class="money-in"><span>₦</span><input id="eeAmt" class="num" type="number" inputmode="decimal" value="'+(Number(e.amount)||0)+'"></div></div>'
      +'<div class="field"><label>Date</label><input id="eeDate" type="date" value="'+e.date+'" max="'+today()+'"></div></div>',
     '<div class="two"><button class="btn ghost" onclick="closeModal()">Cancel</button>'
    +'<button class="btn primary" onclick="submitEditExpense(\''+id+'\')">Save changes</button></div>');
}
function submitEditExpense(id){
  const e=store.expenses.find(function(x){ return x.id===id; });
  if(!e){ toast('That expense is no longer there','bad'); return; }
  const amt=parseFloat(cuVal('eeAmt'))||0;
  if(amt<=0){ toast('Enter the amount','bad'); return; }
  e.amount=amt; e.cat=cuVal('eeCat')||e.cat; e.desc=cuVal('eeDesc').trim(); e.date=cuVal('eeDate')||e.date;
  saveE(); closeModal(); rerender(); toast('Expense updated','good');
}

/* ===== MODAL ===== */
function openModal(title,body,foot){
  document.getElementById('modal').innerHTML=`
    <div class="modal-head"><h3>${title}</h3><button class="x" onclick="closeModal()">✕</button></div>
    <div class="modal-body">${body}</div>${foot?`<div class="modal-foot">${foot}</div>`:''}`;
  document.getElementById('modalBack').classList.add('show');
}
function closeModal(){ document.getElementById('modalBack').classList.remove('show'); }
document.getElementById('modalBack').addEventListener('click',e=>{ if(e.target.id==='modalBack')closeModal(); });

function backupJSON(){ dl(new Blob([JSON.stringify(store,null,2)],{type:'application/json'}), 'St-Ritas-Foodz-backup-'+today()+'.json'); toast('Backup downloaded','good'); }
function restoreJSON(input){ const f=input.files[0]; if(!f)return; const rd=new FileReader();
  rd.onload=()=>{ try{ const d=JSON.parse(rd.result); if(!d.products)throw 0;
    askConfirm('Restore this backup? It will replace all current records on this device.', function(){
      store=Object.assign({products:[],sales:[],purchases:[],expenses:[],settings:{}}, d);
      if(!store.settings.staff)store.settings.staff=['Staff 1','Staff 2'];
      if(!store.settings.biz)store.settings.biz="St. Rita's Foodz"; if(store.settings.low==null)store.settings.low=3;
      saveP();saveS();saveB();saveE();saveSet(); document.getElementById('bizName').textContent=store.settings.biz;
      go('home'); toast('Records restored','good');
    }, 'Restore', true);
  }catch(e){ toast('That file could not be read','bad'); } }; rd.readAsText(f); }
function exportCSV(){
  const rows=[['Date','Time','Type','Item / Detail','Category','Unit','Qty','Unit price','Amount','Staff','Note','Channel','Charge','Airtime card','Cash back','Platform']];
  [...store.sales].sort((a,b)=>a.ts-b.ts).forEach(s=>{ const t=new Date(s.ts).toLocaleTimeString('en-NG',{hour:'2-digit',minute:'2-digit'});
    if(s.airtime){ rows.push([s.date,t,'Airtime',s.note||'Airtime','','','','',s.total,s.staff||'','',s.channel||'','',s.airtime.amount,s.airtime.cashback,s.airtime.platform]); return; }
    if(!s.items||!s.items.length){ rows.push([s.date,t,'Sale',s.note||'Cash sale','','','','',s.total,s.staff||'',s.backfill?'catch-up':(s.quick?'total entry':''),s.channel||'',s.charge||'']); return; }
    s.items.forEach(it=>rows.push([s.date,t,'Sale',it.name,'',it.unit||'pcs',it.qty,it.price,it.sub,s.staff||'',s.note||'',s.channel||'',s.charge||''])); });
  store.purchases.slice().sort((a,b)=>a.ts-b.ts).forEach(p=>rows.push([p.date,'','Purchase',p.desc||'Stock',p.supplier||'','','','',p.amount,'',p.stockNote||(p.backfill?'catch-up':''),'','']));
  store.expenses.slice().sort((a,b)=>a.ts-b.ts).forEach(e=>rows.push([e.date,'','Expense',e.desc||e.cat,e.cat,'','','',e.amount,'',e.backfill?'catch-up':'','','']));
  (store.settings.debts||[]).slice().sort((a,b)=>(a.ts||0)-(b.ts||0)).forEach(d=>rows.push([d.date||'','','Debt '+(d.paid?'(paid)':'(owing)'),d.item||'',d.cust||'','',d.qty||'',d.amount||'',(Number(d.qty)||0)*(Number(d.amount)||0),'',d.note||'','','']));
  const csv=rows.map(r=>r.map(c=>{ c=(c==null?'':''+c); return /[",\n]/.test(c)?'"'+c.replace(/"/g,'""')+'"':c; }).join(',')).join('\n');
  dl(new Blob([csv],{type:'text/csv'}), 'St-Ritas-Foodz-records-'+today()+'.csv'); toast('CSV exported','good');
}
function dl(blob,name){ const u=URL.createObjectURL(blob); const a=document.createElement('a'); a.href=u; a.download=name; a.click(); setTimeout(()=>URL.revokeObjectURL(u),1000); }
function wipe(){
  askConfirm('Erase ALL sales, purchases and expenses on this device?\nYour item list and prices stay. This cannot be undone.', function(){
    askConfirm('Last check — permanently clear all transactions?', function(){
      store.sales=[];store.purchases=[];store.expenses=[]; saveS();saveB();saveE(); go('home'); toast('Transactions erased');
    }, 'Erase everything', true);
  }, 'Continue', true);
}

/* ===== INIT ===== */
load(); renderHome();
setTimeout(function(){ var s=document.getElementById('splash'); if(s){ s.classList.add('hide'); setTimeout(function(){ s.style.display='none'; },550); } }, 1400);
</script>
