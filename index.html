<title>St. Rita's Foodz — Records</title>
<style>
  :root{
    --bg:#F4F2ED;--surface:#FFFFFF;--surface-2:#FBF9F5;--ink:#211E19;--ink-soft:#6B655C;--line:#E7E2D8;
    --brand:#173F30;--brand-2:#215A45;--gold:#E0A032;--gold-soft:#F6E7C8;
    --in:#1E7A52;--in-soft:#E4F1E9;--out:#B23A22;--out-soft:#F7E4DE;
    --shadow:0 1px 2px rgba(33,30,25,.06), 0 8px 24px rgba(33,30,25,.06);--r:16px;--nav-h:64px;
    font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;
  }
  *{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
  html,body{margin:0;padding:0}
  body{background:var(--bg);color:var(--ink);font-size:15px;line-height:1.45;
    padding-bottom:calc(var(--nav-h) + env(safe-area-inset-bottom));-webkit-font-smoothing:antialiased}
  .num{font-variant-numeric:tabular-nums;font-feature-settings:"tnum" 1}
  .app{max-width:640px;margin:0 auto;min-height:100vh}
  button{font-family:inherit;cursor:pointer;border:none;background:none;color:inherit}
  input,select,textarea{font-family:inherit;font-size:15px}
  h1,h2,h3{margin:0;font-weight:750;letter-spacing:-.01em}
  ::placeholder{color:#B4AEA3}

  header{position:sticky;top:0;z-index:40;background:var(--brand);color:#fff;padding:14px 16px 24px;
    border-radius:0 0 22px 22px;box-shadow:0 6px 20px rgba(23,63,48,.18)}
  .brandrow{display:flex;align-items:center;gap:11px}
  .mark{width:40px;height:40px;border-radius:11px;flex:none;background:#fff;display:grid;place-items:center;overflow:hidden;box-shadow:0 1px 3px rgba(0,0,0,.18),inset 0 0 0 1px rgba(255,255,255,.5)}
  .mark img{width:100%;height:100%;object-fit:contain;padding:2px;display:block}
  .brandrow h1{font-size:17px;line-height:1.05;color:#fff}
  .brandrow .sub{font-size:11.5px;color:#BFD8CC;letter-spacing:.08em;text-transform:uppercase;font-weight:600}
  .banner{display:block;margin:12px -16px -24px;line-height:0}
  .banner img{width:100%;height:auto;display:block;max-height:190px;object-fit:cover;object-position:center}
  @media(min-width:520px){ .banner img{max-height:230px} }
  .hbtn{margin-left:auto;display:flex;gap:8px}
  .hbtn button{background:rgba(255,255,255,.12);color:#EAF3EE;border:1px solid rgba(255,255,255,.14);
    padding:8px 11px;border-radius:11px;font-size:12.5px;font-weight:650}
  .hbtn button:active{background:rgba(255,255,255,.22)}

  main{padding:16px 14px 26px}
  .view{display:none;animation:fade .25s ease}
  .view.active{display:block}
  @keyframes fade{from{opacity:0;transform:translateY(4px)}to{opacity:1;transform:none}}
  .eyebrow{font-size:11.5px;font-weight:700;letter-spacing:.1em;text-transform:uppercase;color:var(--ink-soft);margin:2px 0 10px}
  .viewtitle{font-size:22px;margin-bottom:2px}
  .viewsub{color:var(--ink-soft);font-size:13.5px;margin-bottom:16px}

  .card{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);box-shadow:var(--shadow)}
  .pad{padding:16px}

  .today-hero{background:linear-gradient(160deg,#1c4a39,#173F30);color:#fff;border:none;border-radius:20px;padding:18px;
    box-shadow:0 10px 26px rgba(23,63,48,.2);margin-bottom:14px}
  .today-hero .lbl{font-size:12px;letter-spacing:.08em;text-transform:uppercase;color:#AFCFC0;font-weight:600}
  .today-hero .net{font-size:38px;font-weight:820;letter-spacing:-.02em;margin:2px 0;line-height:1}
  .today-hero .net.neg{color:#FFC9B8}
  .today-hero .date{font-size:12.5px;color:#9FC1B2}
  .split{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-top:14px}
  .split .box{background:rgba(255,255,255,.09);border:1px solid rgba(255,255,255,.12);border-radius:13px;padding:11px 12px}
  .split .box .k{font-size:11.5px;color:#BFD8CC;letter-spacing:.04em}
  .split .box .v{font-size:18px;font-weight:750;margin-top:1px}
  .stat-row{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-bottom:14px}
  .stat{background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:12px 13px;box-shadow:var(--shadow)}
  .stat .k{font-size:12px;color:var(--ink-soft);font-weight:600}
  .stat .v{font-size:20px;font-weight:780;margin-top:2px}
  .stat.in .v{color:var(--in)} .stat.out .v{color:var(--out)}
  .stat.tap{cursor:pointer} .stat.tap:active{background:var(--surface-2)}
  .stat .warnv{color:var(--out)}

  .section-head{display:flex;align-items:baseline;justify-content:space-between;margin:20px 2px 10px}
  .section-head h3{font-size:15px}
  .section-head .link{font-size:12.5px;color:var(--brand-2);font-weight:650;cursor:pointer}

  .chartcard{padding:14px 12px 8px}
  .chart{width:100%;height:130px;display:block}
  .chart .bar{fill:var(--brand-2)} .chart .bar.today{fill:var(--gold)}
  .chart-x{display:flex;justify-content:space-between;font-size:10px;color:var(--ink-soft);padding:4px 2px 0}

  .row{display:flex;align-items:center;gap:12px;padding:12px 14px;border-bottom:1px solid var(--line)}
  .row:last-child{border-bottom:none}
  .row .ico{width:34px;height:34px;border-radius:10px;flex:none;display:grid;place-items:center;font-size:15px;font-weight:800}
  .ico.in{background:var(--in-soft);color:var(--in)} .ico.buy{background:var(--gold-soft);color:#9a6d16} .ico.exp{background:var(--out-soft);color:var(--out)}
  .row .body{min-width:0;flex:1}
  .row .t{font-weight:650;font-size:14px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  .row .s{font-size:12px;color:var(--ink-soft);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  .row .amt{font-weight:750;font-size:15px;white-space:nowrap}
  .row .amt.in{color:var(--in)} .row .amt.out{color:var(--out)}
  .empty{text-align:center;color:var(--ink-soft);padding:30px 16px;font-size:13.5px}
  .empty b{display:block;color:var(--ink);font-size:15px;margin-bottom:4px;font-weight:700}

  .staffbar{display:flex;gap:8px;align-items:center;margin-bottom:12px}
  .staffbar label{font-size:12px;color:var(--ink-soft);font-weight:600}
  .searchwrap{position:relative;margin-bottom:10px}
  .searchwrap input{width:100%;padding:13px 14px 13px 40px;border:1px solid var(--line);border-radius:13px;background:var(--surface)}
  .searchwrap svg{position:absolute;left:13px;top:50%;transform:translateY(-50%);color:#9c968b}
  .searchwrap input:focus{outline:none;border-color:var(--brand-2);box-shadow:0 0 0 3px rgba(33,90,69,.12)}
  .chips{display:flex;gap:7px;overflow-x:auto;padding:2px 0 8px;scrollbar-width:none}
  .chips::-webkit-scrollbar{display:none}
  .chip{flex:none;padding:7px 13px;border-radius:999px;border:1px solid var(--line);background:var(--surface);font-size:12.5px;font-weight:600;color:var(--ink-soft)}
  .chip.on{background:var(--brand);color:#fff;border-color:var(--brand)}
  .grid{display:grid;grid-template-columns:repeat(2,1fr);gap:9px;margin-top:4px}
  @media(min-width:520px){.grid{grid-template-columns:repeat(3,1fr)}}
  .prod{text-align:left;background:var(--surface);border:1px solid var(--line);border-radius:13px;padding:11px;min-height:70px;
    display:flex;flex-direction:column;justify-content:space-between;box-shadow:var(--shadow);position:relative}
  .prod:active{transform:scale(.97)}
  .prod .pn{font-size:12.5px;font-weight:650;line-height:1.2;word-break:break-word}
  .prod .pp{font-size:12px;color:var(--brand-2);font-weight:750;margin-top:6px}
  .prod .pp.noprice{color:#b9925f}
  .prod .stk{font-size:10.5px;color:var(--ink-soft);margin-top:2px;font-weight:600}
  .prod .stk.low{color:var(--out)}
  .prod .qbadge{position:absolute;top:-7px;right:-7px;background:var(--gold);color:#3a2705;min-width:22px;height:22px;border-radius:11px;
    display:grid;place-items:center;font-size:12px;font-weight:800;padding:0 5px;box-shadow:0 2px 6px rgba(0,0,0,.18)}

  .cartbar{position:fixed;left:0;right:0;bottom:calc(var(--nav-h) + env(safe-area-inset-bottom));z-index:35;display:none;justify-content:center;padding:0 12px 10px;pointer-events:none}
  .cartbar.show{display:flex}
  .cartbar .inner{pointer-events:auto;max-width:616px;width:100%;background:var(--brand);color:#fff;border-radius:15px;padding:11px 14px;display:flex;align-items:center;gap:12px;box-shadow:0 8px 26px rgba(23,63,48,.32)}
  .cartbar .ci{font-size:12.5px;color:#BFD8CC} .cartbar .ct{font-size:19px;font-weight:800}
  .cartbar .go{margin-left:auto;background:var(--gold);color:#3a2705;font-weight:800;padding:10px 16px;border-radius:11px;font-size:14px}

  .field{margin-bottom:13px}
  .field label{display:block;font-size:12.5px;font-weight:650;color:var(--ink-soft);margin-bottom:6px}
  .field input,.field select,.field textarea{width:100%;padding:12px 13px;border:1px solid var(--line);border-radius:12px;background:var(--surface);color:var(--ink)}
  .field input:focus,.field select:focus{outline:none;border-color:var(--brand-2);box-shadow:0 0 0 3px rgba(33,90,69,.12)}
  .field .money-in{position:relative}
  .field .money-in span{position:absolute;left:13px;top:50%;transform:translateY(-50%);color:var(--ink-soft);font-weight:700}
  .field .money-in input{padding-left:26px}
  .two{display:grid;grid-template-columns:1fr 1fr;gap:10px}
  .btn{display:block;width:100%;padding:14px;border-radius:13px;font-weight:750;font-size:15px;text-align:center}
  .btn.primary{background:var(--brand);color:#fff;box-shadow:0 6px 16px rgba(23,63,48,.2)} .btn.primary:active{background:var(--brand-2)}
  .btn.gold{background:var(--gold);color:#3a2705}
  .btn.ghost{background:var(--surface);border:1px solid var(--line);color:var(--ink)}
  .btn.danger{background:var(--out-soft);color:var(--out);border:1px solid #f0cabd}
  .btn:disabled{opacity:.5}
  .subtabs{display:flex;gap:6px;background:var(--surface-2);border:1px solid var(--line);border-radius:12px;padding:4px;margin-bottom:16px}
  .subtabs button{flex:1;padding:9px;border-radius:9px;font-size:13px;font-weight:700;color:var(--ink-soft)}
  .subtabs button.on{background:var(--brand);color:#fff}
  .optbox{border:1px dashed var(--line);border-radius:12px;padding:12px;margin-bottom:13px;background:var(--surface-2)}
  .optbox .oh{font-size:12px;font-weight:700;color:var(--ink-soft);margin-bottom:9px}

  .period{display:flex;gap:7px;overflow-x:auto;padding-bottom:8px;margin-bottom:6px;scrollbar-width:none}
  .period::-webkit-scrollbar{display:none}
  .repgrid{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin:14px 0}
  .repcard{background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:13px;box-shadow:var(--shadow)}
  .repcard .k{font-size:11.5px;color:var(--ink-soft);font-weight:600;text-transform:uppercase;letter-spacing:.04em}
  .repcard .v{font-size:21px;font-weight:800;margin-top:3px}
  .repcard.profit{grid-column:1/-1;background:linear-gradient(160deg,#1c4a39,#173F30);color:#fff;border:none}
  .repcard.profit .k{color:#AFCFC0} .repcard.profit .v{font-size:28px} .repcard.profit .v.neg{color:#FFC9B8}
  .toprod{display:flex;align-items:center;gap:10px;padding:10px 0;border-bottom:1px solid var(--line)}
  .toprod:last-child{border:none}
  .toprod .rank{width:22px;height:22px;border-radius:7px;background:var(--gold-soft);color:#9a6d16;display:grid;place-items:center;font-size:12px;font-weight:800;flex:none}
  .toprod .tn{flex:1;font-size:13.5px;font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  .toprod .tq{font-size:12px;color:var(--ink-soft)} .toprod .tv{font-weight:750;font-size:13.5px}

  .additem{display:flex;gap:8px;margin-bottom:12px}
  .icard{background:var(--surface);border:1px solid var(--line);border-radius:13px;padding:11px 12px;margin-bottom:9px;box-shadow:var(--shadow)}
  .icard .ih{display:flex;align-items:center;gap:8px;margin-bottom:9px}
  .icard .ih .n{flex:1;font-weight:650;font-size:14px;min-width:0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  .icard .ih .c{font-size:11px;color:var(--ink-soft);background:var(--surface-2);border:1px solid var(--line);padding:2px 7px;border-radius:999px;flex:none}
  .icard .ih .del{color:var(--out);font-size:17px;padding:2px 4px;flex:none}
  .icard .grid4{display:grid;grid-template-columns:1fr 1fr;gap:8px}
  .fmini label{display:block;font-size:10.5px;color:var(--ink-soft);font-weight:600;margin-bottom:3px}
  .fmini .mi{position:relative}
  .fmini .mi span{position:absolute;left:8px;top:50%;transform:translateY(-50%);color:var(--ink-soft);font-size:12px}
  .fmini input{width:100%;padding:8px 8px;border:1px solid var(--line);border-radius:9px;text-align:right;font-variant-numeric:tabular-nums;background:var(--surface-2)}
  .fmini.money input{padding-left:19px}
  .fmini input:focus{outline:none;border-color:var(--brand-2);background:#fff}

  .modal-back{position:fixed;inset:0;background:rgba(20,18,14,.5);z-index:60;display:none;align-items:flex-end;justify-content:center}
  .modal-back.show{display:flex;animation:fade .2s}
  .modal{background:var(--bg);width:100%;max-width:640px;border-radius:22px 22px 0 0;max-height:88vh;display:flex;flex-direction:column;animation:slideup .28s cubic-bezier(.2,.9,.3,1)}
  @keyframes slideup{from{transform:translateY(100%)}to{transform:none}}
  .modal-head{display:flex;align-items:center;justify-content:space-between;padding:16px 16px 10px}
  .modal-head h3{font-size:17px}
  .modal-head .x{font-size:22px;color:var(--ink-soft);width:34px;height:34px;border-radius:10px;background:var(--surface);border:1px solid var(--line);display:grid;place-items:center}
  .modal-body{overflow:auto;padding:0 14px 14px}
  .modal-foot{padding:12px 14px calc(14px + env(safe-area-inset-bottom));border-top:1px solid var(--line);background:var(--surface)}

  .citem{background:var(--surface);border:1px solid var(--line);border-radius:13px;padding:10px;margin-bottom:9px}
  .citem .top{display:flex;align-items:center;gap:10px}
  .citem .cn{flex:1;min-width:0}
  .citem .cn .n{font-weight:650;font-size:13.5px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  .citem .cn .sn{font-size:11px;color:var(--ink-soft)}
  .citem .pinput{position:relative;width:96px}
  .citem .pinput span{position:absolute;left:9px;top:50%;transform:translateY(-50%);color:var(--ink-soft);font-size:13px}
  .citem .pinput input{width:100%;padding:8px 8px 8px 20px;border:1px solid var(--line);border-radius:9px;text-align:right;font-variant-numeric:tabular-nums}
  .stepper{display:flex;align-items:center;border:1px solid var(--line);border-radius:10px;overflow:hidden;flex:none}
  .stepper button{width:30px;height:34px;font-size:18px;font-weight:700;background:var(--surface-2);color:var(--brand)}
  .stepper .q{width:32px;text-align:center;font-weight:750;font-variant-numeric:tabular-nums}
  .crem{color:var(--out);font-size:18px;padding:2px 4px;flex:none}
  .cedit{color:var(--brand-2);font-size:16px;padding:2px 6px;flex:none}
  .row.tap{cursor:pointer} .row.tap:active{background:var(--surface-2)}
  .daypick{margin-bottom:14px}
  .daypick>label{display:block;font-size:12.5px;font-weight:650;color:var(--ink-soft);margin-bottom:8px}
  .daypick .dprow{display:flex;gap:8px;align-items:center}
  .daypick .dprow input{flex:1;min-width:0;padding:11px;border:1px solid var(--line);border-radius:11px;background:var(--surface);font-size:14px}
  .daypick .dprow .btn{width:auto;padding:11px 16px;white-space:nowrap}
  .daypick .dpchips{display:flex;gap:6px;flex-wrap:wrap;margin-top:9px}
  .eline{display:grid;grid-template-columns:1fr auto auto auto;gap:8px;align-items:end;padding:11px 12px;border-bottom:1px solid var(--line)}
  .eline:last-child{border-bottom:none}
  .eline .en{font-size:13px;font-weight:700;line-height:1.3;align-self:center;min-width:0;overflow-wrap:anywhere}
  .eline .eq{display:flex;flex-direction:column;gap:3px;width:66px}
  .eline .eq label{font-size:9.5px;text-transform:uppercase;letter-spacing:.04em;color:var(--ink-soft);font-weight:700}
  .eline .eq input{width:100%;padding:7px 8px;border:1px solid var(--line);border-radius:9px;background:var(--surface);font-size:13px;text-align:right}
  .eline .crem{align-self:center}
  .unittoggle{display:flex;gap:0;margin-top:9px;border:1px solid var(--line);border-radius:9px;overflow:hidden;width:fit-content}
  .unittoggle button{padding:6px 14px;font-size:12px;font-weight:700;color:var(--ink-soft);background:var(--surface-2)}
  .unittoggle button.on{background:var(--brand);color:#fff}
  .cart-total{display:flex;justify-content:space-between;align-items:center;margin-bottom:10px;padding:0 2px}
  .cart-total .l{font-size:13px;color:var(--ink-soft)} .cart-total .v{font-size:26px;font-weight:820}

  nav{position:fixed;left:0;right:0;bottom:0;z-index:50;height:calc(var(--nav-h) + env(safe-area-inset-bottom));padding-bottom:env(safe-area-inset-bottom);
    background:rgba(255,255,255,.92);backdrop-filter:saturate(1.4) blur(12px);border-top:1px solid var(--line);display:flex;max-width:640px;margin:0 auto}
  nav button{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:3px;color:var(--ink-soft);font-size:10.5px;font-weight:650;padding-top:8px}
  nav button svg{width:23px;height:23px} nav button.on{color:var(--brand)}
  nav button.sell-fab{color:#fff}
  nav button.sell-fab .fabcircle{width:46px;height:46px;border-radius:50%;background:linear-gradient(160deg,var(--gold),#c9861f);display:grid;place-items:center;margin-top:-16px;box-shadow:0 6px 16px rgba(224,160,50,.5);color:#3a2705}
  nav button.sell-fab .fabcircle svg{width:26px;height:26px} nav button.sell-fab span{color:var(--gold);margin-top:1px}

  .toast{position:fixed;left:50%;bottom:calc(var(--nav-h) + 20px);transform:translateX(-50%);background:var(--ink);color:#fff;padding:11px 18px;border-radius:12px;font-size:13.5px;font-weight:600;z-index:80;opacity:0;transition:opacity .25s,transform .25s;pointer-events:none;box-shadow:0 8px 24px rgba(0,0,0,.25)}
  .toast.show{opacity:1;transform:translateX(-50%) translateY(-4px)} .toast.good{background:var(--in)} .toast.bad{background:var(--out)}
  .hint{background:var(--gold-soft);border:1px solid #ecd9ac;color:#7a5a12;border-radius:12px;padding:11px 13px;font-size:12.5px;margin-bottom:14px;line-height:1.4}
  small.muted{color:var(--ink-soft)}
  .restock .row .amt{color:var(--out);font-size:13px}
  .mtable{width:100%;border-collapse:collapse;font-size:12.5px;min-width:430px}
  .mtable th,.mtable td{padding:9px 10px;text-align:right;white-space:nowrap;border-bottom:1px solid var(--line)}
  .mtable th:first-child,.mtable td:first-child{text-align:left}
  .mtable thead th{font-size:10.5px;color:var(--ink-soft);text-transform:uppercase;letter-spacing:.03em;font-weight:700}
  .mtable tbody td{font-variant-numeric:tabular-nums}
  .mtable tfoot td{font-weight:800;border-top:2px solid var(--line);border-bottom:none;font-variant-numeric:tabular-nums}
  .mtable .pos{color:var(--in)} .mtable .neg{color:var(--out)}
  .tscroll{overflow-x:auto;-webkit-overflow-scrolling:touch}
  /* staff dropdown menu */
  .menuwrap{position:relative}
  .menu{display:none;position:absolute;right:0;top:calc(100% + 6px);z-index:40;min-width:210px;background:var(--surface);border:1px solid var(--line);border-radius:13px;box-shadow:0 10px 28px rgba(20,18,14,.18);overflow:hidden}
  .menu.show{display:block}
  .menu button{display:flex;align-items:center;justify-content:space-between;gap:10px;width:100%;text-align:left;padding:12px 14px;background:none;border:none;border-bottom:1px solid var(--line);font:inherit;font-size:13.5px;font-weight:650;color:var(--ink);cursor:pointer}
  .menu button:last-child{border-bottom:none}
  .menu button:active{background:var(--surface-2)}
  .menu .mbadge{font-size:11px;font-weight:800;padding:2px 8px;border-radius:999px;background:var(--out-soft);color:var(--out)}
  /* debt list */
  .debtable td.cust{font-weight:700}
  .debtable tr.paid td{opacity:.55;text-decoration:line-through}
  .dtot{display:flex;gap:10px;margin-bottom:14px}
  .dtot .box{flex:1;background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:12px 14px}
  .dtot .box .k{font-size:11.5px;color:var(--ink-soft);font-weight:650;margin-bottom:3px}
  .dtot .box .v{font-size:18px;font-weight:800}
  /* item detail */
  .idet .kv{display:flex;justify-content:space-between;gap:12px;padding:9px 0;border-bottom:1px solid var(--line);font-size:13px}
  .idet .kv:last-child{border-bottom:none}
  .idet .kv .k{color:var(--ink-soft);font-weight:600}
  .idet .kv .v{font-weight:750;text-align:right}
  .plogtable th:nth-child(2),.plogtable td:nth-child(2){text-align:left}
  .plog{border-bottom:1px solid var(--line);padding:13px 14px}
  .plog:last-child{border-bottom:none}
  .plog .ph{display:flex;justify-content:space-between;align-items:baseline;gap:10px;margin-bottom:10px}
  .plog .pn{font-size:14.5px;font-weight:750;line-height:1.25}
  .plog .pc{font-size:14.5px;font-weight:800;color:var(--out);white-space:nowrap;font-variant-numeric:tabular-nums}
  .plog .pgrid{display:grid;grid-template-columns:1fr 1fr;gap:8px 12px}
  .plog .pk{font-size:10px;color:var(--ink-soft);text-transform:uppercase;letter-spacing:.04em;font-weight:700;margin-bottom:1px}
  .plog .pv{font-size:13px;font-weight:700;font-variant-numeric:tabular-nums}
  .plog .pnote{font-size:12px;color:var(--ink-soft);margin-top:8px;line-height:1.45}
  .pgrp{background:var(--surface);border:1px solid var(--line);border-radius:14px;box-shadow:var(--shadow);margin-bottom:12px;overflow:hidden}
  .pgrp .gh{display:flex;justify-content:space-between;align-items:baseline;gap:10px;padding:12px 14px 0}
  .pgrp .gn{font-size:14.5px;font-weight:800;line-height:1.25}
  .pgrp .gn small{display:block;font-size:11px;font-weight:600;color:var(--ink-soft);margin-top:2px}
  .pgrp .gt{font-size:14.5px;font-weight:800;color:var(--out);white-space:nowrap;font-variant-numeric:tabular-nums}
  .pgrp .gchips{display:flex;flex-wrap:wrap;gap:6px;padding:10px 14px 12px}
  .pgrp .gchip{font-size:11px;font-weight:650;color:var(--ink-soft);background:var(--surface-2);border:1px solid var(--line);border-radius:999px;padding:3px 9px;font-variant-numeric:tabular-nums}
  .pgrp .gchip b{color:var(--ink);font-weight:800}
  .pgrp .gchip.up b{color:var(--out)} .pgrp .gchip.down b{color:var(--in)}
  .pgrp .glist{border-top:1px solid var(--line)}
  .pgrp .glist .row{padding:11px 14px} .pgrp .glist .row:last-child{border-bottom:none}
  .pgrp .gday{background:none;border:none;color:var(--brand-2);font-size:15px;padding:4px 6px;cursor:pointer;flex:none}
  .profrow{display:flex;align-items:center;gap:10px;padding:10px 0;border-bottom:1px solid var(--line)}
  .profrow:last-child{border:none}
  .profrow .pn{flex:1;min-width:0;font-size:13.5px;font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  .profrow .pn small{color:var(--ink-soft);font-weight:500}
  .profrow .pv{text-align:right;font-variant-numeric:tabular-nums}
  .profrow .pv .p{font-weight:750;font-size:13.5px}
  .profrow .pv .m{font-size:11px;color:var(--ink-soft)}
  .flag{font-size:10px;color:var(--gold);border:1px solid #ecd9ac;background:var(--gold-soft);padding:1px 5px;border-radius:6px;margin-left:6px;font-weight:600}
  #splash{position:fixed;inset:0;z-index:200;background:linear-gradient(160deg,#1c4a39,#123020);display:flex;flex-direction:column;align-items:center;justify-content:center;gap:18px;transition:opacity .5s ease}
  #splash.hide{opacity:0;pointer-events:none}
  #splash .scard{background:#fff;border-radius:26px;padding:26px 30px;box-shadow:0 24px 70px rgba(0,0,0,.35);max-width:80%;animation:pop .55s cubic-bezier(.2,.9,.3,1)}
  #splash .scard img{width:100%;max-width:250px;display:block}
  #splash .sload{color:#BFD8CC;font-size:12px;letter-spacing:.14em;text-transform:uppercase;font-weight:600;opacity:0;animation:fadein .6s ease .35s forwards}
  @keyframes pop{from{transform:scale(.9);opacity:0}to{transform:scale(1);opacity:1}}
  @keyframes fadein{to{opacity:1}}
</style>
</head>

const NOTE_OPTS = ['Main cash','Pure water','Jinja','Iru Soap','Drink','POS','Transfer sales','Home purchase'];
/* lists saved before 'Home purchase' existed get it added once; removing it in settings afterwards sticks */
function upgradeNoteOpts(st){
  if(st.homeOptAdded) return;
  if(st.noteOpts.indexOf('Home purchase')<0) st.noteOpts.push('Home purchase');
  st.homeOptAdded=true;
}

/* sale types that attract a bank/POS charge */
function isChargeable(n){ n=(n||'').toLowerCase(); return n==='pos' || n.indexOf('transfer')>-1; }
/* sale types that draw down a stock item, and the item name each one maps to.
   Recording one of these writes a linked cost entry against that item's purchase record. */
const STOCK_TYPES = { 'jinja':'Jinja', 'drink':'Drink', 'pure water':'Pure water' };
function stockTypeKey(n){ return STOCK_TYPES[(n||'').toLowerCase()] || ''; }

/* ===== STORAGE (v2) ===== */
const K = {p:'srf_v2_products', s:'srf_v2_sales', b:'srf_v2_purchases', e:'srf_v2_expenses', set:'srf_v2_settings'};
const V1 = {s:'srf_v1_sales', b:'srf_v1_purchases', e:'srf_v1_expenses', set:'srf_v1_settings'};
const LAST_SUP = 'srf_v2_last_supplier';
let store = { products:[], sales:[], purchases:[], expenses:[], settings:{} };
let undoStack=[], _pendingSnap=true, _loading=false;

function readJSON(key,fallbackKey,def){
  let raw=localStorage.getItem(key);
  if(raw===null && fallbackKey) raw=localStorage.getItem(fallbackKey);
  if(raw===null) return def;
  try{ return JSON.parse(raw); }catch(e){ return def; }
}
function load(){
  _loading=true;
  store.products = readJSON(K.p,null,null);
  if(!Array.isArray(store.products) || !store.products.length){
    const seen=new Set();
    store.products = INV.split('|').map(s=>{
      const [name,qp,qc,pp,pc]=s.split(';');
      return {id:uid(), name:name.trim(), cat:guessCat(name),
        pp:+pp||0, pc:+pc||0, qp:+qp||0, qc:+qc||0};
    }).filter(p=>{ const k=p.name.toLowerCase(); if(seen.has(k))return false; seen.add(k); return true; });
    saveP();
  }
  // additive migration: ensure new fields exist on every product
  store.products.forEach(p=>{ if(p.cost==null)p.cost=0; if(p.costC==null)p.costC=0; if(p.pw==null)p.pw=0; });
  saveP();
  store.sales     = readJSON(K.s, V1.s, []);
  store.purchases = readJSON(K.b, V1.b, []);
  store.expenses  = readJSON(K.e, V1.e, []);
  store.settings  = readJSON(K.set, V1.set, {});
  if(!store.settings.staff) store.settings.staff=['Staff 1','Staff 2'];
  if(!store.settings.biz) store.settings.biz="St. Rita's Foodz";
  if(store.settings.low==null) store.settings.low=3;
  if(store.settings.pin==null) store.settings.pin='';
  if(!Array.isArray(store.settings.suppliers)) store.settings.suppliers=[];
  if(!Array.isArray(store.settings.debts)) store.settings.debts=[];
  if(!Array.isArray(store.settings.contacts)) store.settings.contacts=[];
  if(!Array.isArray(store.settings.noteOpts)) store.settings.noteOpts=NOTE_OPTS.slice();
  /* upgrade the first-generation option list to the new sale types */
  if(JSON.stringify(store.settings.noteOpts)===JSON.stringify(['Main cash','Pure water','Drink POS','Transfer sales'])){
    store.settings.noteOpts=NOTE_OPTS.slice();
    if(store.settings.lastNote==='Drink POS') store.settings.lastNote='POS';
  }
  upgradeNoteOpts(store.settings);
  if(store.settings.lastNote==null) store.settings.lastNote='';
  // persist under v2 so migration only happens once
  saveS(); saveB(); saveE(); saveSet();
  document.getElementById('bizName').textContent=store.settings.biz;
  _loading=false;
}
/* ----- UNDO: snapshot the saved state before each change ----- */
function captureUndo(){
  if(_loading || !_pendingSnap) return;
  _pendingSnap=false;
  undoStack.push({ p:localStorage.getItem(K.p), s:localStorage.getItem(K.s), b:localStorage.getItem(K.b), e:localStorage.getItem(K.e), set:localStorage.getItem(K.set) });
  if(undoStack.length>20) undoStack.shift();
  updateUndoBtn();
  setTimeout(function(){ _pendingSnap=true; }, 0);
}
function saveP(){ captureUndo(); localStorage.setItem(K.p, JSON.stringify(store.products)); }
function saveS(){ captureUndo(); localStorage.setItem(K.s, JSON.stringify(store.sales)); }
function saveB(){ captureUndo(); localStorage.setItem(K.b, JSON.stringify(store.purchases)); }
function saveE(){ captureUndo(); localStorage.setItem(K.e, JSON.stringify(store.expenses)); }
function saveSet(){ captureUndo(); localStorage.setItem(K.set, JSON.stringify(store.settings)); }
function reloadStore(){
  store.products=JSON.parse(localStorage.getItem(K.p)||'[]');
  store.sales=JSON.parse(localStorage.getItem(K.s)||'[]');
  store.purchases=JSON.parse(localStorage.getItem(K.b)||'[]');
  store.expenses=JSON.parse(localStorage.getItem(K.e)||'[]');
  try{ store.settings=JSON.parse(localStorage.getItem(K.set)||'{}'); }catch(e){ store.settings={}; }
  if(!store.settings.staff)store.settings.staff=['Staff 1','Staff 2'];
  if(!store.settings.biz)store.settings.biz="St. Rita's Foodz";
  if(store.settings.low==null)store.settings.low=3;
  if(store.settings.pin==null)store.settings.pin='';
  if(!Array.isArray(store.settings.suppliers))store.settings.suppliers=[];
  if(!Array.isArray(store.settings.debts))store.settings.debts=[];
  if(!Array.isArray(store.settings.contacts))store.settings.contacts=[];
  if(!Array.isArray(store.settings.noteOpts))store.settings.noteOpts=NOTE_OPTS.slice();
  if(JSON.stringify(store.settings.noteOpts)===JSON.stringify(['Main cash','Pure water','Drink POS','Transfer sales'])){
    store.settings.noteOpts=NOTE_OPTS.slice();
    if(store.settings.lastNote==='Drink POS') store.settings.lastNote='POS';
  }
  upgradeNoteOpts(store.settings);
  if(store.settings.lastNote==null)store.settings.lastNote='';
  const bn=document.getElementById('bizName'); if(bn)bn.textContent=store.settings.biz;
}
function updateUndoBtn(){ const b=document.getElementById('undoBtn'); if(!b)return; b.style.display = undoStack.length ? '' : 'none'; }
function undo(){
  if(!undoStack.length){ toast('Nothing to undo','bad'); return; }
  const snap=undoStack.pop();
  const map={p:K.p,s:K.s,b:K.b,e:K.e,set:K.set};
  Object.keys(map).forEach(function(k){ if(snap[k]===null) localStorage.removeItem(map[k]); else localStorage.setItem(map[k], snap[k]); });
  reloadStore();
  closeModal();
  rerender();
  updateUndoBtn();
  toast('Last action undone','good');
}

/* ===== HELPERS ===== */
function uid(){ return Date.now().toString(36)+Math.random().toString(36).slice(2,7); }
function money(n){ n=Number(n)||0; return '₦'+n.toLocaleString('en-NG',{maximumFractionDigits:2}); }
function pad(x){ return x<10?'0'+x:''+x; }
function dstr(d){ return d.getFullYear()+'-'+pad(d.getMonth()+1)+'-'+pad(d.getDate()); }
function today(){ return dstr(new Date()); }
function niceDate(iso){ const [y,m,dd]=iso.split('-').map(Number); return new Date(y,m-1,dd).toLocaleDateString('en-NG',{weekday:'short',day:'numeric',month:'short'}); }
function esc(s){ return (s||'').replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c])); }
function toast(m,t){ const el=document.getElementById('toast'); el.textContent=m; el.className='toast show '+(t||''); clearTimeout(el._t); el._t=setTimeout(()=>el.className='toast',1900); }
function saleIncome(s){ return s.noIncome ? 0 : (s.total||0); }
function isAdjust(p){ return !!(p.correction || p.manual || (Number(p.amount)||0) < 0); }
function realBuyTotal(iso){ return store.purchases.filter(p=>p.date===iso && !isAdjust(p)).reduce((a,p)=>a+p.amount,0); }
function salesTotal(iso){ return store.sales.filter(s=>s.date===iso).reduce((a,s)=>a+saleIncome(s),0); }
function purchTotal(iso){ return store.purchases.filter(p=>p.date===iso).reduce((a,p)=>a+p.amount,0); }
function expTotal(iso){ return store.expenses.filter(e=>e.date===iso).reduce((a,e)=>a+e.amount,0); }
function invValue(){ return store.products.reduce((a,p)=>a + (p.qp>0?p.qp*p.pp:0) + (p.qc>0?p.qc*p.pc:0), 0); }
function invValueCost(){ return store.products.reduce((a,p)=>a + (p.qp>0?p.qp*(p.cost||0):0) + (p.qc>0?p.qc*(p.costC||0):0), 0); }
function expectedProfit(){ return store.products.reduce((a,p)=>a + (p.qp>0&&p.cost>0?p.qp*(p.pp-p.cost):0) + (p.qc>0&&p.costC>0?p.qc*(p.pc-p.costC):0), 0); }
function lowStock(){ const t=store.settings.low; return store.products
  .filter(p=>(p.pp>0||p.pc>0) && p.qc<=0 && p.qp<=t)
  .sort((a,b)=>a.qp-b.qp); }
function stockLabel(p){
  if(p.qp>0 && p.qc>0) return p.qp+' pcs · '+p.qc+' ctn';
  if(p.qp>0) return p.qp+' left';
  if(p.qc>0) return p.qc+' ctn';
  return 'out of stock';
}
/* plain number for table cells (₦ noted once in the table footer) */
function plain(n){ return (Number(n)||0).toLocaleString('en-NG',{maximumFractionDigits:2}); }
function timeOf(ts){ return ts?new Date(ts).toLocaleTimeString('en-NG',{hour:'numeric',minute:'2-digit'}):''; }
function csvOf(rows){ return rows.map(function(r){ return r.map(function(c){ c=(c==null?'':''+c); return /[",\n]/.test(c)?'"'+c.replace(/"/g,'""')+'"':c; }).join(','); }).join('\n'); }
/* ----- printing: a plain black-on-white page in a hidden frame, so the app itself is not printed ----- */
function printTable(head, rows, foot){
  const cell=function(tag,c){ return '<'+tag+(typeof c==='number'?' class="n"':'')+'>'+(typeof c==='number'?plain(c):esc(c==null?'':''+c))+'</'+tag+'>'; };
  return '<table><thead><tr>'+head.map(function(h){ return '<th>'+esc(h)+'</th>'; }).join('')+'</tr></thead>'
    +'<tbody>'+rows.map(function(r){ return '<tr>'+r.map(function(c){ return cell('td',c); }).join('')+'</tr>'; }).join('')+'</tbody>'
    +(foot?'<tfoot><tr>'+foot.map(function(c){ return cell('td',c); }).join('')+'</tr></tfoot>':'')+'</table>';
}
function printDoc(title, inner){
  const old=document.getElementById('printFrame'); if(old) old.remove();
  const f=document.createElement('iframe'); f.id='printFrame';
  f.style.cssText='position:fixed;right:0;bottom:0;width:0;height:0;border:0';
  document.body.appendChild(f);
  const d=f.contentWindow.document;
  d.open();
  d.write('<!doctype html><html><head><meta charset="utf-8"><title>'+esc(title)+'</title><style>'
    +'body{font-family:-apple-system,Segoe UI,Roboto,Arial,sans-serif;color:#000;margin:18px;font-size:12px}'

    +'</style></head><body><h1>'+esc(store.settings.biz)+' — '+esc(title)+'</h1>'
    +'<div class="sub">Printed '+esc(niceDate(today()))+' at '+esc(timeOf(Date.now()))+' · amounts in ₦</div>'+inner+'</body></html>');
  d.close();
  setTimeout(function(){
    try{ f.contentWindow.focus(); f.contentWindow.print(); }
    catch(e){ toast('Printing is not available here — use Export instead','bad'); }
  },300);
}
/* ----- expiry dates ----- */
function addMonths(iso,n){ const [y,m,d]=iso.split('-').map(Number); return dstr(new Date(y,m-1+n,d)); }
function daysUntil(iso){ const [y,m,d]=iso.split('-').map(Number); const t=new Date(); t.setHours(0,0,0,0); return Math.round((new Date(y,m-1,d)-t)/86400000); }
function expiryText(iso){
  const n=daysUntil(iso);
  if(n<0) return 'expired '+(-n)+' day'+(n!==-1?'s':'')+' ago';
  if(n===0) return 'expires today';
  return 'expires in '+n+' day'+(n!==1?'s':'');
}
const EXPIRY_WARN_MONTHS=3;
/* stock-in rows whose goods expire within 3 months (or already have), and are still on the shelf */
function expiringSoon(){
  const limit=addMonths(today(), EXPIRY_WARN_MONTHS);
  return store.purchases.filter(function(p){
    if(!p.expiry || p.expiryDone || isAdjust(p) || p.expiry>limit) return false;
    const it=p.itemId?store.products.find(function(x){ return x.id===p.itemId; }):null;
    return !it || it.qp>0 || it.qc>0;
  }).sort(function(a,b){ return a.expiry.localeCompare(b.expiry); });
}
function dismissExpiry(id){
  const p=store.purchases.find(function(x){ return x.id===id; }); if(!p) return;
  askConfirm('Stop reminding about '+(p.itemName||'this stock')+' ('+expiryText(p.expiry)+')?\nDo this once the goods are sold, returned or thrown away.', function(){
    p.expiryDone=true; saveB(); rerender(); toast('Reminder cleared','good');
  }, 'Clear reminder');
}
/* nearest upcoming expiry recorded for an item, '' if none */
function itemExpiry(p){
  const ex=store.purchases.filter(function(b){ return b.itemId===p.id && b.expiry && !b.expiryDone; })
    .map(function(b){ return b.expiry; }).sort();
  return ex[0]||'';
}
/* ----- last supplier used: kept outside settings so it never lands on the undo stack ----- */
function lastSupplier(){
  try{
    const v=localStorage.getItem(LAST_SUP)||'';
    return (store.settings.suppliers||[]).includes(v) ? v : '';
  }catch(e){ return ''; }
}
function rememberSupplier(v){
  if(v==='__new__') return;
  try{ localStorage.setItem(LAST_SUP, v||''); }catch(e){}
}
function supplierPicked(sel){
  if(!sel) return;
  if(sel.value==='__new__'){ addSupplierFromForm(); return; }
  rememberSupplier(sel.value);
}

/* ===== DAY VIEW: everything that happened on one day ===== */
let dayViewDate=null;
function openDay(iso){
  if(iso) dayViewDate=iso;
  if(!dayViewDate) dayViewDate=today();
  if(dayViewDate>today()) dayViewDate=today();
  go('day');
}
function shiftDayView(days){
  const cur=dayViewDate||today();
  const [yy,mm,dd]=cur.split('-').map(Number);
  const dt=new Date(yy,mm-1,dd); dt.setDate(dt.getDate()+days);
  let ns=dstr(dt); if(ns>today()) ns=today();
  dayViewDate=ns; renderDay();
}
function dayRow(opts){
  return '<div class="row">'
    +'<div class="ico '+opts.ico+'">'+opts.glyph+'</div>'
    +'<div class="body"><div class="t">'+opts.title+'</div><div class="s">'+opts.sub+'</div></div>'
    +'<div class="amt '+(opts.amtCls||'')+' num">'+opts.amt+'</div>'
    +'<button class="cedit" title="Edit" onclick="'+opts.edit+'">✎</button>'
    +'<button class="crem" title="Delete" onclick="'+opts.del+'">✕</button></div>';
}
function renderDay(){
  const iso=today();
  if(!dayViewDate) dayViewDate=iso;
  const vd=dayViewDate;
  const isToday=vd===iso;
  const sales=store.sales.filter(function(s){ return s.date===vd; }).slice().sort(function(a,b){ return (a.ts||0)-(b.ts||0); });
  const buys=store.purchases.filter(function(p){ return p.date===vd; }).slice().sort(function(a,b){ return (a.ts||0)-(b.ts||0); });
  const exps=store.expenses.filter(function(e){ return e.date===vd; }).slice().sort(function(a,b){ return (a.ts||0)-(b.ts||0); });

  const inc=salesTotal(vd), buy=purchTotal(vd), exp=expTotal(vd), net=inc-buy-exp;
  const nSales=sales.filter(function(s){ return !s.noIncome && s.total>0; }).length;

  const salesList=sales.length? sales.map(function(s){
    const items=(s.items&&s.items.length)?s.items:null;
    const title=items? items.map(function(it){ return esc(it.name)+' ×'+it.qty; }).join(', ') : (esc(s.note)||'Cash sale');
    const bits=[timeOf(s.ts), s.staff?esc(s.staff):'', s.noIncome?'already counted':'', (items&&s.note)?esc(s.note):'',
      s.airtime?'card '+money(s.airtime.amount)+' + cash back '+money(s.airtime.cashback):''].filter(Boolean);
    return dayRow({ ico:s.noIncome?'buy':'in', glyph:s.noIncome?'⇄':'↓',
      title:title, sub:bits.join(' · ')||'—',
      amt:(s.noIncome?'':'+')+money(s.total).slice(1), amtCls:s.noIncome?'':'in',
      edit:"editSale('"+s.id+"')", del:"delSale('"+s.id+"')" });
  }).join('') : '<div class="empty">No sales recorded.</div>';

  const buyList=buys.length? buys.map(function(p){
    const neg=(Number(p.amount)||0)<0;
    const bits=[timeOf(p.ts), p.supplier?esc(p.supplier):'',
      p.qty>0?(p.qty+' '+(p.unit||'pcs')+' @ '+money(p.rate)):'', p.desc&&p.itemName?esc(p.desc):''].filter(Boolean);
    return dayRow({ ico:neg?'in':'buy', glyph:neg?'↺':'▣',
      title:esc(p.itemName||p.desc||'Stock purchase'), sub:bits.join(' · ')||'—',
      amt:'−'+money(Math.abs(p.amount)).slice(1), amtCls:neg?'in':'out',
      edit:"editPurchase('"+p.id+"')", del:"delRec('b','"+p.id+"')" });
  }).join('') : '<div class="empty">No stock bought.</div>';

  const expList=exps.length? exps.map(function(e){
    return dayRow({ ico:'exp', glyph:'↑', title:esc(e.desc||e.cat),
      sub:[timeOf(e.ts), esc(e.cat)].filter(Boolean).join(' · '),
      amt:'−'+money(e.amount).slice(1), amtCls:'out',
      edit:"editExpense('"+e.id+"')", del:"delRec('e','"+e.id+"')" });
  }).join('') : '<div class="empty">No expenses.</div>';

  /* debts are credit given, not money in or out, so they sit beside the net rather than inside it */
  const debts=(store.settings.debts||[]).filter(function(d){ return d.date===vd; }).slice().sort(function(a,b){ return (a.ts||0)-(b.ts||0); });
  const debtDay=debts.reduce(function(a,d){ return a+debtTotal(d); },0);
  const debtPaidDay=(store.settings.debts||[]).filter(function(d){ return d.paid && d.paidDate===vd; }).reduce(function(a,d){ return a+debtTotal(d); },0);
  const debtList=debts.length? debts.map(function(d){
    return dayRow({ ico:d.paid?'in':'exp', glyph:d.paid?'✓':'⧗',
      title:esc(d.cust||'-')+' — '+esc(d.item||'-')+' ×'+(Number(d.qty)||0),
      sub:[timeOf(d.ts), d.paid?'paid'+(d.paidDate?' '+niceDate(d.paidDate):''):'still owing', d.note?esc(d.note):''].filter(Boolean).join(' · '),
      amt:money(debtTotal(d)).slice(1), amtCls:d.paid?'in':'out',
      edit:"openDebtForm('"+d.id+"')", del:"delDebt('"+d.id+"')" });
  }).join('') : '<div class="empty">No debts recorded.</div>';

  document.getElementById('v-day').innerHTML=''
    +'<div class="viewtitle">'+(isToday?'Today':niceDate(vd))+'</div>'
    +'<div class="viewsub">Everything recorded on this day. Tap ✎ on any line to correct a wrong entry.</div>'
    +'<div class="card pad" style="margin-bottom:14px;background:var(--surface-2)">'
      +'<div style="display:flex;gap:8px;align-items:center">'
        +'<button class="btn ghost" style="width:auto;padding:11px 15px;font-size:16px" onclick="shiftDayView(-1)">◀</button>'
        +'<input type="date" value="'+vd+'" max="'+iso+'" onchange="dayViewDate=this.value;renderDay()" style="flex:1;padding:11px;border:1px solid var(--line);border-radius:11px;background:var(--surface)">'
        +'<button class="btn ghost" style="width:auto;padding:11px 15px;font-size:16px'+(isToday?';opacity:.4':'')+'" '+(isToday?'disabled':'')+' onclick="shiftDayView(1)">▶</button></div>'
      +(isToday?'':'<button class="btn ghost" style="margin-top:8px" onclick="dayViewDate=\''+iso+'\';renderDay()">Jump back to today</button>')
    +'</div>'
    +'<div class="today-hero">'
      +'<div class="lbl">Net on this day (in − out)</div>'
      +'<div class="net num '+(net<0?'neg':'')+'">'+money(net)+'</div>'
      +'<div class="date">'+nSales+' sale'+(nSales!==1?'s':'')+' · '+buys.length+' purchase'+(buys.length!==1?'s':'')+' · '+exps.length+' expense'+(exps.length!==1?'s':'')+'</div>'
      +'<div class="split">'
        +'<div class="box"><div class="k">Money in</div><div class="v num">'+money(inc)+'</div></div>'

    +'<div class="card">'+buyList+'</div>'
    +'<div class="section-head"><h3>Expenses</h3><small class="muted num">'+money(exp)+'</small></div>'
    +'<div class="card">'+expList+'</div>'

    +'<button class="btn ghost" style="margin-bottom:10px" onclick="outViewDate=\''+vd+'\';outTab=\'log\';go(\'out\')">🧾 Purchase details for this day</button>'
    +'<button class="btn ghost" onclick="go(\'home\')">← Back to home</button>'

/* ===== JINJA / DRINK / PURE WATER -> PURCHASE RECORD LINK =====
   Selling one of these draws down the stock you bought. We post a linked
   drawdown row against that item's purchase record so the log always shows
   how much of what you bought has been sold off, and what value is left. */

/* the stock-in rows for one tracked line, newest first */
function stockTypePurchases(key){
  const k=(key||'').toLowerCase();
  return store.purchases.filter(function(b){
    if(b.saleLink) return false;                       // never count our own drawdowns
    return (b.itemName||b.desc||'').toLowerCase().indexOf(k)>-1;
  });
}
/* what has been bought, drawn down, and what is left for a tracked line */
function stockTypeBalance(key){
  const bought=stockTypePurchases(key).reduce(function(a,b){ return a+(Number(b.amount)||0); },0);
  const drawn=store.purchases.filter(function(b){
    return b.saleLink && (b.stockKey||'').toLowerCase()===(key||'').toLowerCase();
  }).reduce(function(a,b){ return a+Math.abs(Number(b.amount)||0); },0);
  return { bought:bought, drawn:drawn, left:bought-drawn };
}
/* post the drawdown for a sale. amount excludes any POS/transfer charge. */
function linkSaleToPurchase(sale){
  const key=stockTypeKey(sale.channel);
  if(!key) return;
  const amt=Math.abs(Number(sale.total)||0)-Math.abs(Number(sale.charge)||0)*(sale.chargeAdds?1:0);
  if(amt<=0) return;
  store.purchases.push({
    id:uid(), ts:Date.now(), date:sale.date, supplier:'', qty:0,
    itemName:key,
    desc:key+' sold - drawdown',
    amount:-Math.abs(amt),
    saleLink:sale.id,       // ties this row to the sale that created it
    stockKey:key,
    autoDraw:true
  });
  saveB();
}
/* remove the drawdown when its sale is deleted or edited */
function unlinkSaleFromPurchase(saleId){
  const before=store.purchases.length;
  store.purchases=store.purchases.filter(function(b){ return b.saleLink!==saleId; });
  if(store.purchases.length!==before) saveB();
}

function recordQuickSale(){
  const amt=parseFloat(document.getElementById('qsAmt').value)||0;
  if(amt<=0){ toast('Enter the amount','bad'); return; }
  qsLastDate=document.getElementById('qsDate').value||today();
  qsLastStaff=document.getElementById('qsStaff').value;
  const note=cuVal('qsNote');
  const chg=isChargeable(note)?(parseFloat(cuVal('qsCharge'))||0):0;
  const addEl=document.getElementById('qsChargeAdd');
  const adds=!!(addEl&&addEl.checked);
  const total=adds?amt+chg:amt;
  /* remember the channel and charge settings so the next entry is fast */
  store.settings.lastNote=note;
  store.settings.lastCharge=chg||'';
  store.settings.chargeAdds=adds;
  saveSet();
  const sale={ id:uid(), date:qsLastDate, ts:Date.now(), staff:qsLastStaff,
    note:note, channel:note, charge:chg, chargeAdds:adds, items:[], quick:true, total:total };
  store.sales.push(sale);
  saveS();
  linkSaleToPurchase(sale);
  toast('Sale recorded · '+money(total)+(isStockType(note)?' · '+stockTypeKey(note)+' stock drawn down':''),'good');
  renderSell();
}

function delSale(id){
  const s=store.sales.find(x=>x.id===id); if(!s)return;
  askConfirm('Remove this sale of '+money(s.total)+'?'+((s.items&&s.items.length)?' Stock will be added back.':''), function(){
    (s.items||[]).forEach(it=>{ const p=store.products.find(x=>x.id===it.id); if(p){ if(it.unit==='ctn')p.qc=+(p.qc+it.qty).toFixed(2); else p.qp=+(p.qp+it.qty).toFixed(2); } });
    store.sales=store.sales.filter(x=>x.id!==id); saveP(); saveS();
    unlinkSaleFromPurchase(id);
    rerender();
  }, 'Remove', true);
}

function addToCart(id){
  const p=store.products.find(x=>x.id===id); if(!p)return;
  const u=defUnit(p);
  const ex=cart.find(c=>c.id===id && c.unit===u);

function cartSum(){ return cart.reduce((a,c)=>a+c.qty*(Number(c.price)||0),0); }

/* the POS/transfer charge that should be ADDED to the cart total (0 when absorbed) */
function cartExtraCharge(){
  const note=cuVal('saleNote');
  if(!isChargeable(note)) return 0;
  const addEl=document.getElementById('cartChargeAdd');
  if(!(addEl&&addEl.checked)) return 0;
  return parseFloat(cuVal('cartCharge'))||0;
}
function onCartNoteChange(){
  const n=cuVal('saleNote');
  store.settings.lastNote=n; saveSet();
  const w=document.getElementById('cartChargeWrap');
  if(w) w.style.display=isChargeable(n)?'block':'none';
  if(!isChargeable(n)){ const c=document.getElementById('cartCharge'); if(c)c.value=''; }
  cartChargePreview();
}
/* keep the modal total and the save button in step with the charge */
function cartChargePreview(){
  const grand=cartSum()+cartExtraCharge();
  const t=document.getElementById('modalTotal'); if(t) t.textContent=money(grand);
  const b=document.getElementById('cartSaveBtn'); if(b) b.textContent='Record sale · '+money(grand);
}
function setUnit(i,u){ const c=cart[i]; const p=store.products.find(x=>x.id===c.id)||{};
  c.unit=u; c.price=(u==='pcs'?p.pp:p.pc)||0; openCart(); updateCartBar(); }
function cq(i,d){ cart[i].qty=Math.max(1,cart[i].qty+d); openCart(); updateCartBar(); refreshGrid(); }
function cp(i,v){ cart[i].price=v===''?0:parseFloat(v);
  cartChargePreview(); updateCartBar(); }
function crm(i){ cart.splice(i,1); if(!cart.length){closeModal();updateCartBar();refreshGrid();return;} openCart(); updateCartBar(); refreshGrid(); }
function recordSale(){
  const goods=cartSum();
  if(goods<=0){ toast('Enter a price for the items first','bad'); return; }
  const note=cuVal('saleNote');
  const extra=cuVal('saleNote2').trim();
  const chg=isChargeable(note)?(parseFloat(cuVal('cartCharge'))||0):0;
  const addEl=document.getElementById('cartChargeAdd');
  const adds=!!(addEl&&addEl.checked);
  const total=goods+(adds?chg:0);
  store.settings.lastNote=note;
  store.settings.lastCharge=chg||'';
  store.settings.chargeAdds=adds;
  saveSet();
  cart.forEach(c=>{ const p=store.products.find(x=>x.id===c.id); if(!p)return;
    // save price back if product had none
    if(c.unit==='pcs' && (!p.pp) && c.price>0) p.pp=c.price;
    if(c.unit==='ctn' && (!p.pc) && c.price>0) p.pc=c.price;
    // decrement stock
    if(c.unit==='pcs') p.qp=+(p.qp - c.qty).toFixed(2); else p.qc=+(p.qc - c.qty).toFixed(2);
  });
  saveP();
  const sale={ id:uid(), date:today(), ts:Date.now(), staff:sellStaff,
    note:(extra?note+' · '+extra:note), channel:note, charge:chg, chargeAdds:adds,
    items:cart.map(c=>({id:c.id,name:c.name,unit:c.unit,qty:c.qty,price:Number(c.price)||0,sub:c.qty*(Number(c.price)||0)})), total:total };
  store.sales.push(sale);
  saveS();
  linkSaleToPurchase(sale);
  cart=[]; closeModal(); updateCartBar();
  toast('Sale recorded · '+money(total),'good');
  go('home');
}

/* ===== PURCHASE LOG: everything bought on one day, exactly as it was entered ===== */
function dayPurchases(iso){
  return store.purchases.filter(function(p){ return p.date===iso && !isAdjust(p); })
    .slice().sort(function(a,b){ return (a.ts||0)-(b.ts||0); });
}
function purchStats(p){
  const qty=Number(p.qty)||0, rate=Number(p.rate)||0;
  const cost=Number(p.amount)||0, sP=Number(p.sellP)||0, sW=Number(p.sellW)||0;
  const profU=sP>0?sP-rate:0, profW=sW>0?sW-rate:0;
  return { qty, rate, cost, sP, sW, profU, profW,
    pct: (rate>0&&sP>0)?(profU/rate*100):0,
    totProf: (sP>0&&qty>0)?profU*qty:0,
    unitLong: p.unit==='ctn'?'carton':'piece',
    unitShort: p.unit==='ctn'?'ctn':'pcs' };
}
/* ----- search by item: every purchase of one item, across every day ----- */
let plogSearch='';
function buyRate(p){
  const r=Number(p.rate)||0; if(r>0) return r;
  const q=Number(p.qty)||0; return q>0?(Number(p.amount)||0)/q:0;
}
function buySearchGroups(q){
  q=(q||'').trim().toLowerCase();
  if(!q) return [];
  const hits=store.purchases.filter(function(p){
    if(isAdjust(p)) return false;
    return ((p.itemName||'')+' '+(p.desc||'')+' '+(p.supplier||'')).toLowerCase().indexOf(q)>=0;
  });
  const map={}, order=[];
  hits.forEach(function(p){
    const key=p.itemId||('n:'+((p.itemName||p.desc||'stock').toLowerCase()));
    if(!map[key]){ map[key]={ name:p.itemName||p.desc||'Stock', itemId:p.itemId||'', buys:[] }; order.push(key); }
    map[key].buys.push(p);
  });
  return order.map(function(k){
    const g=map[k];
    g.buys.sort(function(a,b){ return (''+b.date).localeCompare(''+a.date) || (b.ts||0)-(a.ts||0); });
    g.spent=0; g.qtyP=0; g.qtyC=0; g.costP=0; g.costC=0;
    g.buys.forEach(function(p){
      const qy=Number(p.qty)||0, amt=Number(p.amount)||0;
      g.spent+=amt;
      if(p.unit==='ctn'){ g.qtyC+=qy; g.costC+=amt; } else { g.qtyP+=qy; g.costP+=amt; }
    });
    g.avgP=g.qtyP>0?g.costP/g.qtyP:0;
    g.avgC=g.qtyC>0?g.costC/g.qtyC:0;
    g.last=g.buys[0]; g.prev=null;
    for(let i=1;i<g.buys.length;i++){ if(g.buys[i].unit===g.last.unit){ g.prev=g.buys[i]; break; } }
    g.item=g.itemId?store.products.find(function(x){ return x.id===g.itemId; })
      :store.products.find(function(x){ return x.name.toLowerCase()===(g.name||'').toLowerCase(); });
    return g;
  }).sort(function(a,b){ return b.spent-a.spent; });
}
function plogSearchHTML(){
  const q=plogSearch.trim();
  if(!q) return '';
  const groups=buySearchGroups(q);
  const head='<div class="section-head"><h3>Search: '+esc(q)+'</h3><span class="link" onclick="clearPlogSearch()">Clear ✕</span></div>';
  if(!groups.length){
    return head+'<div class="empty"><b>No item matches &ldquo;'+esc(q)+'&rdquo;</b>Try part of the name, or a supplier. Every day is searched, not only the day picked above.</div>';
  }
  const nBuys=groups.reduce(function(a,g){ return a+g.buys.length; },0);
  const spent=groups.reduce(function(a,g){ return a+g.spent; },0);
  const body=groups.map(function(g){
    const s=g.last, lastRate=buyRate(s);
    const unitLong=s.unit==='ctn'?'carton':'piece', unitShort=s.unit==='ctn'?'ctn':'pcs';
    const prevRate=g.prev?buyRate(g.prev):0;
    const diff=prevRate>0?(lastRate-prevRate):0;
    const chips=[];
    chips.push('<span class="gchip">Bought <b>'+g.buys.length+'×</b></span>');
    if(g.qtyP>0) chips.push('<span class="gchip">Total <b>'+plain(g.qtyP)+' pcs</b></span>');
    if(g.qtyC>0) chips.push('<span class="gchip">Total <b>'+plain(g.qtyC)+' ctn</b></span>');
    if(g.avgP>0) chips.push('<span class="gchip">Avg cost <b>'+money(g.avgP)+'</b> /piece</span>');
    if(g.avgC>0) chips.push('<span class="gchip">Avg cost <b>'+money(g.avgC)+'</b> /carton</span>');
    if(lastRate>0) chips.push('<span class="gchip">Last cost <b>'+money(lastRate)+'</b> /'+unitLong+'</span>');
    if(diff) chips.push('<span class="gchip '+(diff>0?'up':'down')+'">'+(diff>0?'▲ costlier by':'▼ cheaper by')+' <b>'+money(Math.abs(diff))+'</b></span>');
    chips.push('<span class="gchip">Last bought <b>'+niceDate(s.date)+'</b></span>');
    if(Number(s.sellP)>0) chips.push('<span class="gchip">Sold at <b>'+money(s.sellP)+'</b> then</span>');
    if(g.item){
      const nowStock=(s.unit==='ctn'?Number(g.item.qc):Number(g.item.qp))||0;
      const nowPrice=(s.unit==='ctn'?Number(g.item.pc):Number(g.item.pp))||0;
      chips.push('<span class="gchip">In stock now <b>'+plain(nowStock)+' '+unitShort+'</b></span>');
      if(nowPrice>0) chips.push('<span class="gchip">Price now <b>'+money(nowPrice)+'</b></span>');
    }
    const rows=g.buys.map(function(p){
      const qy=Number(p.qty)||0, r=buyRate(p);
      const meta=[p.supplier||'', qy>0?(plain(qy)+' '+(p.unit==='ctn'?'ctn':'pcs')+' @ '+money(r)):'', p.desc||''].filter(Boolean).join(' · ');
      const prof=(Number(p.sellP)>0&&qy>0)?(Number(p.sellP)-r)*qy:0;
      return '<div class="row"><div class="ico buy">▣</div>'
        +'<div class="body"><div class="t">'+esc(niceDate(p.date))+(p.date===today()?' (today)':'')+'</div>'
        +'<div class="s">'+(meta?esc(meta):'—')+'</div></div>'
        +'<div style="text-align:right"><div class="amt out num">'+money(p.amount)+'</div>'
        +(prof?'<div class="num" style="font-size:11px;color:var(--in)">+'+money(prof).slice(1)+'</div>':'')+'</div>'
        +'<button class="gday" title="Open the log for that day" onclick="plogGoDay(\''+p.date+'\')">📅</button>'
        +'<button class="cedit" title="Edit (passkey needed)" onclick="editPurchase(\''+p.id+'\')">✎</button>'
        +'</div>';
    }).join('');
    return '<div class="pgrp">'
      +'<div class="gh"><div class="gn">'+esc(g.name)+(g.item?'':'<small>not on your item list</small>')+'</div>'
      +'<div class="gt">'+money(g.spent)+'</div></div>'
      +'<div class="gchips">'+chips.join('')+'</div>'
      +'<div class="glist">'+rows+'</div>'
      +'</div>';
  }).join('');
  return head
    +'<div class="num" style="font-size:12.5px;color:var(--ink-soft);margin:0 2px 10px">'
      +groups.length+' item'+(groups.length!==1?'s':'')+' · '+nBuys+' purchase'+(nBuys!==1?'s':'')+' · '+money(spent)+' spent altogether</div>'
    +body
    +'<div style="font-size:11.5px;color:var(--ink-soft);margin:0 2px 14px">Tap ✎ to correct an entry (your passkey is asked first) or 📅 to open the full log for that day. Corrections and manual entries are not listed here.</div>';
}

function stockDrawdownPanelHTML(){
  const keys=Object.keys(STOCK_TYPES).map(function(k){ return STOCK_TYPES[k]; });
  const seen={}, lines=[];
  keys.forEach(function(k){ if(seen[k])return; seen[k]=1; lines.push(k); });
  const rows=lines.map(function(k){
    const b=stockTypeBalance(k);
    if(b.bought<=0 && b.drawn<=0) return '';
    const pct=b.bought>0?Math.max(0,Math.min(100,Math.round(b.drawn/b.bought*100))):0;
    return '<tr>'
      +'<td>'+esc(k)+'</td>'
      +'<td>'+plain(b.bought)+'</td>'
      +'<td class="neg">'+plain(b.drawn)+'</td>'
      +'<td class="'+(b.left<0?'neg':'pos')+'"><b>'+plain(b.left)+'</b></td>'
      +'<td>'+pct+'%</td>'
      +'</tr>';
  }).filter(Boolean).join('');
  if(!rows) return '';

    +'<div class="card tscroll"><table class="mtable">'
    +'<thead><tr><th>Line</th><th>Bought</th><th>Sold off</th><th>Left</th><th>Used</th></tr></thead>'
    +'<tbody>'+rows+'</tbody></table></div>'

      s.sP>0?+s.profU.toFixed(2):'', (s.rate>0&&s.sP>0)?s.pct.toFixed(0)+'%':'', s.totProf?+s.totProf.toFixed(2):'', p.expiry||'']);

function addStockIn(){
  const name=cuVal('siItem').trim();
  const qty=parseFloat(cuVal('siQty'))||0;
  const amount=parseFloat(cuVal('siAmt'))||0;
  const unit=cuVal('siUnit')==='ctn'?'ctn':'pcs';
  const sellP=parseFloat(cuVal('siSellP'))||0;
  const sellW=parseFloat(cuVal('siSellW'))||0;
  const date=cuVal('siDate')||today();
  let supplier=cuVal('siSup').trim(); if(supplier==='__new__') supplier='';
  const desc=cuVal('siDesc').trim();
  const expiry=cuVal('siExp');
  if(!name){ toast('Type the item name','bad'); return; }
  if(amount<=0){ toast('Enter the amount paid','bad'); return; }
  const data={qty,amount,unit,sellP,sellW,date,supplier,desc,expiry};
  const p=store.products.find(x=>x.name.toLowerCase()===name.toLowerCase());
  if(!p){
    askConfirm('"'+name+'" is not in your item list yet.\nAdd it as a new item and record this stock-in?', function(){
      const np={id:uid(),name:name,cat:guessCat(name),pp:0,pc:0,pw:0,cost:0,costC:0,qp:0,qc:0};
      store.products.push(np); commitStockIn(np,data);
    }, 'Add & save');
    return;
  }
  commitStockIn(p,data);
}
function commitStockIn(p,d){
  const rate=d.qty>0?+(d.amount/d.qty).toFixed(2):0;
  if(d.qty>0){ if(d.unit==='ctn') p.qc=+(p.qc+d.qty).toFixed(2); else p.qp=+(p.qp+d.qty).toFixed(2); }
  if(d.unit==='ctn'){ if(rate>0)p.costC=rate; if(d.sellP>0)p.pc=d.sellP; }
  else { if(rate>0)p.cost=rate; if(d.sellP>0)p.pp=d.sellP; if(d.sellW>0)p.pw=d.sellW; }
  saveP();
  store.purchases.push({ id:uid(), ts:Date.now(), date:d.date, supplier:d.supplier, desc:d.desc,
    itemId:p.id, itemName:p.name, qty:d.qty, unit:d.unit, amount:d.amount, rate, sellP:d.sellP, sellW:d.sellW,
    expiry:d.expiry||'',
    stockNote:(d.qty>0?('+'+d.qty+' '+d.unit+' '+p.name):'') });
  saveB();
  if(d.supplier) rememberSupplier(d.supplier);
  toast('Stock in saved · '+p.name,'good');
  renderOut();
}

function openManualBuy(){
  openModal('Fix / adjust stock bought',
     '<div class="hint">Use <b>Reduce</b> to cancel a duplicated or wrong purchase — it lowers <b>both Money Out and Stock bought</b> for the day you choose. Use <b>Add</b> to record a purchase amount quickly. Reductions need the passkey.<br><br>Tip: set the date to the <b>day of the original purchase</b> so it corrects that day (not today).</div>'
    +'<div class="field"><label>Direction</label><select id="mbDir"><option value="reduce">Reduce stock bought (fix double / wrong entry)</option><option value="add">Add stock bought</option></select></div>'
    +'<div class="field"><label>Amount</label><div class="money-in"><span>₦</span><input id="mbAmt" class="num" type="number" inputmode="decimal" placeholder="0"></div></div>'
    +'<div class="field"><label>Date of the original purchase</label><input id="mbDate" type="date" value="'+(outViewDate||today())+'" max="'+today()+'"></div>'
    +'<div class="field" style="margin-bottom:0"><label>Reason / item</label><input id="mbNote" placeholder="e.g. duplicate party jollof stock purchase"></div>',
     '<div class="two"><button class="btn ghost" onclick="closeModal()">Cancel</button><button class="btn danger" onclick="submitManualBuy()">Save</button></div>');
}
function submitManualBuy(){
  const dir=cuVal('mbDir')||'reduce';
  const amt=parseFloat(cuVal('mbAmt'))||0;
  const date=cuVal('mbDate')||today();
  const note=cuVal('mbNote').trim();
  if(amt<=0){ toast('Enter the amount','bad'); return; }
  const commit=function(){
    const signed = dir==='reduce' ? -Math.abs(amt) : Math.abs(amt);
    store.purchases.push({ id:uid(), ts:Date.now(), date, supplier:'', qty:0,
      desc:(note?((dir==='reduce'?'Stock-bought fix: ':'Manual buy: ')+note):(dir==='reduce'?'Stock-bought correction':'Manual stock purchase')),
      amount:signed, manual:true });
    saveB(); renderOut(); toast(dir==='reduce'?'Stock bought reduced by '+money(amt):'Stock purchase added','good');
  };
  if(dir==='reduce') askPin('reduce Stock bought by '+money(amt), commit); else commit();
}
/* ----- continuous stock-in history (traceable ledger) ----- */
let histSearch='';
function stockInList(){
  const q=histSearch.toLowerCase();
  return store.purchases.filter(function(p){return p.itemId||p.qty>0||p.correction||p.manual;})
    .filter(function(p){return (p.itemName||p.desc||'').toLowerCase().includes(q) || (p.supplier||'').toLowerCase().includes(q);})
    .sort(function(a,b){ return (''+b.date).localeCompare(''+a.date) || b.ts-a.ts; });
}
function histRows(list){
  if(!list.length) return '<div class="empty">No records'+(histSearch?' match':'')+' yet.</div>';
  return list.map(function(p){
    if(p.correction || p.amount<0){
      return '<div class="row"><div class="ico in">↺</div>'
        +'<div class="body"><div class="t">'+esc(p.desc||'Money Out correction')+'</div><div class="s">'+niceDate(p.date)+' · Money Out reduced</div></div>'
        +'<div class="amt in num">−'+money(Math.abs(p.amount)).slice(1)+'</div>'
        +'<button class="cedit" title="Edit" onclick="editPurchase(\''+p.id+'\')">✎</button>'
        +'<button class="crem" onclick="histDel(\''+p.id+'\')">✕</button></div>';
    }
    const prof=(p.sellP>0&&p.qty>0)?(p.sellP-p.rate)*p.qty:0;
    const meta=[p.supplier||'', p.qty>0?(p.qty+' '+(p.unit||'pcs')+' @ '+money(p.rate)):'', p.desc||''].filter(Boolean).join(' · ');
    return '<div class="row"><div class="ico buy">▣</div>'
      +'<div class="body"><div class="t">'+esc(p.itemName||p.desc||'Stock')+'</div><div class="s">'+niceDate(p.date)+(meta?' · '+esc(meta):'')+'</div></div>'
      +'<div style="text-align:right"><div class="amt out num">'+money(p.amount)+'</div>'+(prof?'<div class="num" style="font-size:11px;color:var(--in)">+'+money(prof).slice(1)+'</div>':'')+'</div>'
      +'<button class="cedit" title="Edit" onclick="editPurchase(\''+p.id+'\')">✎</button>'
      +'<button class="crem" onclick="histDel(\''+p.id+'\')">✕</button></div>';
  }).join('');
}

function refreshHist(){
  const list=stockInList();
  const el=document.getElementById('histList'); if(el) el.innerHTML=histRows(list);
  const c=document.getElementById('histCount'); if(c) c.textContent=list.length+' records · '+money(list.reduce(function(a,p){return a+p.amount;},0))+' total';

function histDel(id){
  const p=store.purchases.find(function(x){return x.id===id;}); if(!p)return;
  askConfirm('Delete this stock-in of '+money(p.amount)+' for '+(p.itemName||'stock')+'?\nThis reduces Money Out by '+money(p.amount)+((p.itemId&&p.qty>0)?' and takes back the '+p.qty+' '+(p.unit||'pcs')+' it added.':'.'), function(){
    if(p.itemId&&p.qty>0){ const it=store.products.find(function(x){return x.id===p.itemId;}); if(it){ if(p.unit==='ctn')it.qc=+(it.qc-p.qty).toFixed(2); else it.qp=+(it.qp-p.qty).toFixed(2); saveP(); } }
    store.purchases=store.purchases.filter(function(x){return x.id!==id;}); saveB();
    openStockHistory(); toast('Deleted · Money Out reduced','good');
  }, 'Delete', true);
}
function addExpense(){
  const amt=parseFloat(document.getElementById('eAmt').value)||0;
  if(amt<=0){ toast('Enter the amount','bad'); return; }
  store.expenses.push({ id:uid(), ts:Date.now(), date:document.getElementById('eDate').value||today(),
    cat:document.getElementById('eCat').value, desc:document.getElementById('eDesc').value.trim(), amount:amt });
  saveE(); toast('Expense saved','good'); renderOut();
}
function delRec(type,id){
  if(type==='b'){ const p=store.purchases.find(x=>x.id===id);
    if(p && p.itemId && p.qty>0){ const it=store.products.find(x=>x.id===p.itemId);
      if(it){ if(p.unit==='ctn') it.qc=+(it.qc-p.qty).toFixed(2); else it.qp=+(it.qp-p.qty).toFixed(2); saveP(); } }
    store.purchases=store.purchases.filter(x=>x.id!==id); saveB(); }
  else{ store.expenses=store.expenses.filter(x=>x.id!==id); saveE(); }
  renderOut();
}
/* ----- passkey via in-app modal (works in installed apps; masks characters) ----- */
var _pinOnOk=null;
function askPin(reason, onOk){
  _pinOnOk=onOk||null;
  openPinModal(store.settings.pin ? 'enter' : 'create', reason);
}
function openPinModal(mode, reason){
  const sub = mode==='create'
    ? 'No passkey set yet. Create one now — you will need it every time stock is reduced.'
    : 'Enter your passkey to '+reason+'.';
  openModal(mode==='create'?'Create passkey':'Enter passkey',
     '<div class="hint">'+esc(sub)+'</div>'
    +'<div class="field"><label>'+(mode==='create'?'New passkey':'Passkey')+'</label>'
    +'<input id="pinInput" type="password" inputmode="numeric" autocomplete="off" placeholder="••••" style="letter-spacing:.35em;font-size:18px;text-align:center" onkeydown="if(event.key===\'Enter\')submitPin(\''+mode+'\')"></div>'
    +(mode==='create'?'<div class="field"><label>Confirm passkey</label><input id="pinInput2" type="password" inputmode="numeric" autocomplete="off" placeholder="••••" style="letter-spacing:.35em;font-size:18px;text-align:center"></div>':'')
    +'<div id="pinErr" style="color:var(--out);font-size:12.5px;min-height:16px;font-weight:600"></div>',
     '<div class="two"><button class="btn ghost" onclick="cancelPin()">Cancel</button>'
    +'<button class="btn primary" onclick="submitPin(\''+mode+'\')">'+(mode==='create'?'Set passkey':'Confirm')+'</button></div>');
  setTimeout(function(){ var i=document.getElementById('pinInput'); if(i)i.focus(); },80);
}
function cancelPin(){ _pinOnOk=null; closeModal(); }
function submitPin(mode){
  const v=((document.getElementById('pinInput')||{}).value||'').trim();
  const err=document.getElementById('pinErr');
  if(mode==='create'){
    const v2=((document.getElementById('pinInput2')||{}).value||'').trim();
    if(!v){ if(err)err.textContent='Enter a passkey.'; return; }
    if(v!==v2){ if(err)err.textContent='The two entries do not match.'; return; }
    store.settings.pin=v; saveSet(); toast('Passkey set — keep it safe','good');
    const cb=_pinOnOk; _pinOnOk=null; closeModal(); if(cb)cb(); return;
  }
  if(v!==store.settings.pin){ if(err)err.textContent='Wrong passkey. Try again.';
    const i=document.getElementById('pinInput'); if(i){ i.value=''; i.focus(); } return; }
  const cb=_pinOnOk; _pinOnOk=null; closeModal(); if(cb)cb();
}

function exportIntakes(){
  const rows=[['Date','Supplier','Item','Description','Qty','Unit','Amount','Rate (cost)','Price/Wholesale','Price/pcs','Profit/pcs','Profit/wholesale','% profit','Total profit','Expiry date']];
  store.purchases.filter(p=>p.itemId||p.qty>0).slice().sort((a,b)=>a.ts-b.ts).forEach(p=>{
    const rate=p.rate||0, sP=p.sellP||0, sW=p.sellW||0;
    const profP=sP>0?sP-rate:0, profW=sW>0?sW-rate:0;
    const pct=rate>0&&sP>0?(profP/rate*100).toFixed(0)+'%':'';
    const tot=(sP>0&&p.qty>0)?profP*p.qty:'';
    rows.push([p.date,p.supplier||'',p.itemName||p.desc||'',p.desc||'',p.qty||'',p.unit||'',p.amount||'',rate||'',sW||'',sP||'',sP>0?profP:'',sW>0?profW:'',pct,tot,p.expiry||'']);
  });
  if(rows.length===1){ toast('No stock-in records yet','bad'); return; }
  const csv=rows.map(r=>r.map(c=>{ c=(c==null?'':''+c); return /[",\n]/.test(c)?'"'+c.replace(/"/g,'""')+'"':c; }).join(',')).join('\n');
  dl(new Blob([csv],{type:'text/csv'}), 'St-Ritas-Foodz-stock-in-'+today()+'.csv'); toast('Stock-in table exported','good');
}

function cuShift(days){
  const cur=cuVal('cuDate')||today();
  const [yy,mm,dd]=cur.split('-').map(Number);
  const dt=new Date(yy,mm-1,dd); dt.setDate(dt.getDate()+days);
  let ns=dstr(dt); if(ns>today()) ns=today();
  cuDate=ns;
  openCatchup({sales:cuVal('cuSales'),buy:cuVal('cuBuy'),exp:cuVal('cuExp'),note:cuVal('cuNote'),cat:cuVal('cuExpCat')});
}
function catchupAdd(){
  const date=cuVal('cuDate')||today();
  const sales=parseFloat(cuVal('cuSales'))||0;
  const buy=parseFloat(cuVal('cuBuy'))||0;
  const exp=parseFloat(cuVal('cuExp'))||0;
  const note=cuVal('cuNote').trim();
  const cat=cuVal('cuExpCat')||EXP_CATS[EXP_CATS.length-1];
  if(sales<=0 && buy<=0 && exp<=0){ toast('Enter at least one amount','bad'); return; }
  const ts=Date.now();
  if(sales>0) store.sales.push({id:uid(),date,ts,staff:'',note:note||'Catch-up',items:[],quick:true,backfill:true,total:sales});
  if(buy>0) store.purchases.push({id:uid(),ts,date,desc:note||'Catch-up purchases',supplier:'',amount:buy,backfill:true,stockNote:''});
  if(exp>0) store.expenses.push({id:uid(),ts,date,cat,desc:note||'Catch-up',amount:exp,backfill:true});
  saveS(); saveB(); saveE();
  cuDate=date;
  toast('Added for '+niceDate(date),'good');
  openCatchup();
}
function cuDel(kind,id){
  if(kind==='s'){ const s=store.sales.find(x=>x.id===id);
    if(s){ (s.items||[]).forEach(it=>{ const p=store.products.find(x=>x.id===it.id); if(p){ if(it.unit==='ctn')p.qc=+(p.qc+it.qty).toFixed(2); else p.qp=+(p.qp+it.qty).toFixed(2); } }); }
    store.sales=store.sales.filter(x=>x.id!==id); saveP(); saveS(); }
  else if(kind==='b'){ store.purchases=store.purchases.filter(x=>x.id!==id); saveB(); }
  else { store.expenses=store.expenses.filter(x=>x.id!==id); saveE(); }
  openCatchup();
}

/* ===== REPORTS ===== */
let period='7d';
let reportYear=new Date().getFullYear();
function periodRange(p){
  const now=new Date(); const end=new Date(now.getFullYear(),now.getMonth(),now.getDate()); let start=new Date(end);
  if(p==='today'){}
  else if(p==='7d'){ start.setDate(end.getDate()-6); }
  else if(p==='week'){ const dow=(end.getDay()+6)%7; start.setDate(end.getDate()-dow); }
  else if(p==='month'){ start=new Date(now.getFullYear(),now.getMonth(),1); }
  else if(p==='lastmonth'){ return {start:new Date(now.getFullYear(),now.getMonth()-1,1), end:new Date(now.getFullYear(),now.getMonth(),0)}; }
  else if(p==='all'){ start=new Date(2000,0,1); }
  return {start,end};
}
function inRange(iso,r){ const [y,m,d]=iso.split('-').map(Number); const dt=new Date(y,m-1,d); return dt>=r.start && dt<=r.end; }
function renderReports(){
  const r=periodRange(period);
  const sales=store.sales.filter(s=>inRange(s.date,r));
  const buys=store.purchases.filter(p=>inRange(p.date,r));
  const exps=store.expenses.filter(e=>inRange(e.date,r));
  const inc=sales.reduce((a,s)=>a+saleIncome(s),0), buyT=buys.reduce((a,p)=>a+p.amount,0), expT=exps.reduce((a,e)=>a+e.amount,0);
  const corr=buys.filter(p=>p.amount<0).reduce((a,p)=>a+(-p.amount),0);
  const grossBuy=buyT;   // net stock bought = real purchases minus reductions (matches Money Out − expenses)
  const profit=inc-buyT-expT;
  const airS=sales.filter(s=>s.airtime);
  const airCard=airS.reduce((a,s)=>a+(Number(s.airtime.amount)||0),0), airCash=airS.reduce((a,s)=>a+(Number(s.airtime.cashback)||0),0);
  const series=[]; const cur=new Date(r.start);
  while(cur<=r.end && series.length<62){ const iso=dstr(cur); series.push({iso,v:salesTotal(iso)}); cur.setDate(cur.getDate()+1); }
  const max=Math.max(...series.map(s=>s.v),1); const bw=100/Math.max(series.length,1);
  const bars=series.map((s,i)=>{ const h=Math.round((s.v/max)*96); return `<rect class="bar" x="${i*bw+(bw>4?1.5:.4)}" y="${110-h}" width="${bw-(bw>4?3:.8)}" height="${h}" rx="${bw>4?2:.5}"/>`; }).join('');
  const agg={};
  sales.forEach(s=>(s.items||[]).forEach(it=>{ if(!agg[it.id])agg[it.id]={name:it.name,qty:0,rev:0}; agg[it.id].qty+=it.qty; agg[it.id].rev+=it.sub; }));
  const top=Object.values(agg).sort((a,b)=>b.rev-a.rev).slice(0,6);

  // ---- profit by item (income-generating itemised sales only) ----
  const pf={};
  sales.forEach(s=>{ if(s.noIncome) return; (s.items||[]).forEach(it=>{
    const p=store.products.find(x=>x.id===it.id);
    const uc=p ? (it.unit==='ctn' ? (p.costC||0) : (p.cost||0)) : 0;
    if(!pf[it.id]) pf[it.id]={name:it.name, qty:0, rev:0, cost:0, known:false};
    const e=pf[it.id]; e.qty+=it.qty; e.rev+=it.sub; e.cost+=it.qty*uc; if(uc>0)e.known=true;
  }); });
  const pfArr=Object.values(pf).map(e=>({...e, profit:e.rev-e.cost, margin:e.rev>0?(e.rev-e.cost)/e.rev*100:0})).sort((a,b)=>b.profit-a.profit);
  const grossRev=pfArr.reduce((a,e)=>a+e.rev,0);
  const grossCost=pfArr.reduce((a,e)=>a+e.cost,0);
  const grossProfit=grossRev-grossCost;
  const noCostCount=pfArr.filter(e=>!e.known && e.rev>0).length;

  const ebreak={}; exps.forEach(e=>{ ebreak[e.cat]=(ebreak[e.cat]||0)+e.amount; });
  const ebArr=Object.entries(ebreak).sort((a,b)=>b[1]-a[1]);
  const opts=[['today','Today'],['7d','Last 7 days'],['week','This week'],['month','This month'],['lastmonth','Last month'],['all','All time']];
  const chips=opts.map(([k,l])=>`<button class="chip ${period===k?'on':''}" onclick="period='${k}';renderReports()">${l}</button>`).join('');
  const lbl=opts.find(o=>o[0]===period)[1]; const nSales=sales.length; const avg=nSales?inc/nSales:0;

  // ---- monthly summary (per year) ----

    <div style="height:16px"></div>
    <button class="btn ghost" onclick="exportCSV()">⤓ Export all records to CSV</button>`;

function monthlySummary(year){
  const rows=[]; let ti=0,tb=0,te=0;
  for(let m=0;m<12;m++){ const pre=year+'-'+pad(m+1);
    const inc=store.sales.filter(s=>s.date.startsWith(pre)).reduce((a,s)=>a+saleIncome(s),0);
    const buy=store.purchases.filter(p=>p.date.startsWith(pre)).reduce((a,p)=>a+p.amount,0);
    const exp=store.expenses.filter(e=>e.date.startsWith(pre)).reduce((a,e)=>a+e.amount,0);
    if(inc||buy||exp){ rows.push({m,inc,buy,exp,profit:inc-buy-exp}); ti+=inc; tb+=buy; te+=exp; }
  }
  return {rows, tot:{inc:ti,buy:tb,exp:te,profit:ti-tb-te}};
}
function exportProfit(){
  const r=periodRange(period);
  const sales=store.sales.filter(s=>inRange(s.date,r) && !s.noIncome);
  const pf={};
  sales.forEach(s=>(s.items||[]).forEach(it=>{ const p=store.products.find(x=>x.id===it.id);
    const uc=p?(it.unit==='ctn'?(p.costC||0):(p.cost||0)):0;
    if(!pf[it.id])pf[it.id]={name:it.name,qty:0,rev:0,cost:0}; const e=pf[it.id]; e.qty+=it.qty; e.rev+=it.sub; e.cost+=it.qty*uc; }));
  const arr=Object.values(pf).map(e=>({...e,profit:e.rev-e.cost})).sort((a,b)=>b.profit-a.profit);
  if(!arr.length){ toast('No item sales in this period','bad'); return; }
  const rows=[['Item','Qty sold','Revenue','Cost','Profit','% margin']];
  arr.forEach(e=>rows.push([e.name,e.qty,Math.round(e.rev),Math.round(e.cost),Math.round(e.profit), e.rev>0?((e.profit/e.rev*100).toFixed(0)+'%'):'']));
  rows.push(['TOTAL','',Math.round(arr.reduce((a,e)=>a+e.rev,0)),Math.round(arr.reduce((a,e)=>a+e.cost,0)),Math.round(arr.reduce((a,e)=>a+e.profit,0)),'']);
  const csv=rows.map(r=>r.map(c=>{ c=(c==null?'':''+c); return /[",\n]/.test(c)?'"'+c.replace(/"/g,'""')+'"':c; }).join(',')).join('\n');
  dl(new Blob([csv],{type:'text/csv'}), 'St-Ritas-Foodz-profit-'+today()+'.csv'); toast('Profit report exported','good');
}
function exportMonthly(){
  const ms=monthlySummary(reportYear);
  const rows=[['Month','Sales','Purchases','Expenses','Profit']];
  ms.rows.forEach(r=>rows.push([new Date(reportYear,r.m,1).toLocaleString('en-NG',{month:'long'}),Math.round(r.inc),Math.round(r.buy),Math.round(r.exp),Math.round(r.profit)]));
  rows.push(['TOTAL '+reportYear,Math.round(ms.tot.inc),Math.round(ms.tot.buy),Math.round(ms.tot.exp),Math.round(ms.tot.profit)]);
  const csv=rows.map(r=>r.map(c=>''+c).join(',')).join('\n');
  dl(new Blob([csv],{type:'text/csv'}), 'St-Ritas-Foodz-monthly-'+reportYear+'.csv'); toast('Monthly summary exported','good');
}

let debtFilter='open';   // 'open' | 'paid' | 'all'
let debtSearch='';
let debtCust='';         // '' = every customer, otherwise custKey() of one customer
/* one customer however the name was typed: "mama chika " and "Mama Chika" are the same person */
function custKey(n){ return (n||'').trim().replace(/\s+/g,' ').toLowerCase(); }
/* every customer on the debt list, with what they owe and have paid, biggest debtor first */
function debtCustomers(){
  const map={};
  (store.settings.debts||[]).forEach(function(d){
    const k=custKey(d.cust); if(!k) return;
    if(!map[k]) map[k]={ key:k, name:(d.cust||'').trim(), owing:0, paid:0, nOpen:0, n:0, last:'' };
    const c=map[k], t=debtTotal(d);
    c.n++;
    if(d.paid) c.paid+=t; else { c.owing+=t; c.nOpen++; }
    if((d.date||'')>c.last) c.last=d.date||'';
  });
  return Object.keys(map).map(function(k){ return map[k]; })
    .sort(function(a,b){ return b.owing-a.owing || a.name.localeCompare(b.name); });
}
function debtRows(){
  const q=debtSearch.toLowerCase();
  let list=(store.settings.debts||[]).slice();
  if(debtFilter==='open') list=list.filter(function(d){ return !d.paid; });
  else if(debtFilter==='paid') list=list.filter(function(d){ return d.paid; });
  if(debtCust) list=list.filter(function(d){ return custKey(d.cust)===debtCust; });
  if(q) list=list.filter(function(d){ return (d.cust||'').toLowerCase().indexOf(q)>-1 || (d.item||'').toLowerCase().indexOf(q)>-1; });
  return list.sort(function(a,b){
    if(!!a.paid!==!!b.paid) return a.paid?1:-1;
    return (''+(b.date||'')).localeCompare(''+(a.date||'')) || (b.ts||0)-(a.ts||0);
  });
}
function debtTotal(d){ return (Number(d.qty)||0)*(Number(d.amount)||0); }
function debtFilterLabel(){ return debtFilter==='paid'?'Settled':(debtFilter==='all'?'All rows':'Outstanding'); }

  }).join('');
